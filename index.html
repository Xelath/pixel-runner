          e.dir = dx < 0 ? -1 : 1;
          freeMove = true;
        } else if (e.type === 'armored') {
          // 铁甲怪：移动较慢，需要踩两次才会被消灭
          e.x += e.dir * e.speed * 0.8 * sf;
        } else {
          // 普通巡逻种：红角怪 / 尖刺怪
          e.x += e.dir * e.speed * sf;
        }

        if (!freeMove) {
          if (e.x <= minX) { e.x = minX; e.dir = 1; }
          else if (e.x >= maxX) { e.x = maxX; e.dir = -1; }
        }
        e.anim += moveSpeed;
      }
    },

    updateBoss() {
      if (!this.boss || !this.boss.alive) return;
      const b = this.boss;
      if (b.hurtTimer > 0) b.hurtTimer--;
      const sf = Game.slowFactor || 1;
      // 受伤后短暂加速；二阶段整体速度提升
      const phaseMul = b.phase === 2 ? MECH.BOSS_PHASE2_SPEED : 1;
      const spd = b.baseSpeed * phaseMul * (b.hurtTimer > 0 ? 1.8 : 1) * sf;
      b.speed = spd;
      b.anim += spd;

      // 胆小鬼模式：Boss 只巡逻不发动攻击（与陷阱停用保持一致）
      const coward = COWARD.TRAPS_OFF && Storage.coward() && !Game.multiplayer;
      if (this.bossIntroT > 0) this.bossIntroT -= sf;
      const engaged = this.bossFightStarted && !coward && this.bossIntroT <= 0;

      // 核心光柱延迟引爆
      if (b.beamDelay > 0 && engaged) {
        b.beamDelay -= sf;
        if (b.beamDelay <= 0) {
          b.beamDelay = 0;
          this.spawnCoreBeam(b);
        }
      }

      if (b.style === 'guardian') this.updateBossGuardian(b, spd, sf, engaged);
      else if (b.style === 'core') this.updateBossCore(b, spd, sf, engaged);
      else this.updateBossBrute(b, spd, sf, engaged);

      // 二阶段：周期性召唤小型巡逻怪
      if (b.phase === 2) {
        b.summonCd -= sf;
        if (b.summonCd <= 0) {
          this.summonMinion();
          b.summonCd = MECH.SUMMON_INTERVAL;
        }
      }
    },

    // 第一篇章 Boss：巡逻 + 冲撞 / 落石，半血后狂暴召唤
    updateBossBrute(b, spd, sf, engaged) {
      const minX = b.platform.x;
      const maxX = b.platform.x + b.platform.w - b.w;
      switch (b.act) {
        case 1:                         // 蓄力
          b.actT -= sf;
          if (b.actT <= 0) {
            if (b.nextKind === 2) {
              b.act = 2;
              b.actT = BOSS_MECH.BRUTE_CHARGE;
              b.dir = b.chargeDir;
              Sound.bossHit();
            } else {
              this.spawnBruteRocks(b);
              b.act = 3;
              b.actT = BOSS_MECH.BRUTE_RECOVER;
              Sound.land();
            }
          }
          break;
        case 2:                         // 冲撞
          b.actT -= sf;
          b.x += b.chargeDir * BOSS_MECH.BRUTE_CHARGE_SPEED * sf;
          if (b.x <= minX) {
            b.x = minX; b.act = 3;
            b.actT = BOSS_MECH.BRUTE_RECOVER;
          } else if (b.x >= maxX) {
            b.x = maxX; b.act = 3;
            b.actT = BOSS_MECH.BRUTE_RECOVER;
          } else if (b.actT <= 0) {
            b.act = 3;
            b.actT = BOSS_MECH.BRUTE_RECOVER;
          }
          break;
        case 3:                         // 硬直
          b.actT -= sf;
          if (b.actT <= 0) {
            b.act = 0;
            b.nextAttack = b.phase === 2
              ? BOSS_MECH.BRUTE_INTERVAL_P2 : BOSS_MECH.BRUTE_INTERVAL;
          }
          break;
        default: {                      // 巡逻
          b.x += b.dir * spd;
          if (b.x <= minX) { b.x = minX; b.dir = 1; }
          else if (b.x >= maxX) { b.x = maxX; b.dir = -1; }
          if (!engaged) break;
          b.nextAttack -= sf;
          if (b.nextAttack <= 0) {
            const t = this.nearestPlayer(b.x + b.w / 2, b.y + b.h / 2);
            let dir = t.x < b.x + b.w / 2 ? -1 : 1;
            if (dir < 0 && b.x <= minX + 40) dir = 1;
            else if (dir > 0 && b.x >= maxX - 40) dir = -1;
            b.dir = dir;
            b.chargeDir = dir;
            b.nextKind = b.nextKind === 1 ? 2 : 1;
            b.act = 1;
            b.actT = BOSS_MECH.BRUTE_WINDUP;
            Sound.laser();
          }
        }
      }
    },

    // 落石：在最近玩家位置上方生成 2~3 块下落的岩石
    spawnBruteRocks(b) {
      const t = this.nearestPlayer(b.x + b.w / 2, b.y + b.h / 2);
      const targetX = t.x + t.w / 2;
      const n = b.phase === 2 ? 3 : 2;
      for (let i = 0; i < n; i++) {
        const offset = (i - (n - 1) / 2) * 110;
        const rx = Math.round(Math.max(
          b.platform.x + 20,
          Math.min(b.platform.x + b.platform.w - 40, targetX + offset - 9)));
        this.projectiles.push({
          x: rx, y: 80, w: 18, h: 18, vx: 0, vy: BOSS_MECH.BRUTE_ROCK_SPEED,
          kind: 'rock', life: BOSS_MECH.BRUTE_ROCK_LIFE
        });
      }
      this.addPopup(b.x + b.w / 2, b.y - 20, '落石!', '#ffb066');
    },

    // 暗星守卫：蓄力冲撞 + 震地波，攻击前有明显预警
    updateBossGuardian(b, spd, sf, engaged) {
      const minX = b.platform.x;
      const maxX = b.platform.x + b.platform.w - b.w;
      switch (b.act) {
        case 1:                         // 蓄力
          b.actT -= sf;
          if (b.actT <= 0) {
            if (b.nextKind === 2) {
              this.spawnGuardianWaves(b);
              b.act = 3;
              b.actT = BOSS_MECH.GUARD_RECOVER;
              Sound.land();
            } else {
              b.act = 2;
              b.actT = BOSS_MECH.GUARD_DASH;
              b.dir = b.chargeDir;
              Sound.bossHit();
            }
          }
          break;
        case 2:                         // 冲撞
          b.actT -= sf;
          b.x += b.chargeDir * BOSS_MECH.GUARD_DASH_SPEED * sf;
          if (b.x <= minX) {
            b.x = minX; b.act = 3;
            b.actT = BOSS_MECH.GUARD_RECOVER;
          } else if (b.x >= maxX) {
            b.x = maxX; b.act = 3;
            b.actT = BOSS_MECH.GUARD_RECOVER;
          } else if (b.actT <= 0) {
            b.act = 3;
            b.actT = BOSS_MECH.GUARD_RECOVER;
          }
          break;
        case 3:                         // 硬直
          b.actT -= sf;
          if (b.actT <= 0) {
            b.act = 0;
            b.nextAttack = b.phase === 2
              ? BOSS_MECH.GUARD_INTERVAL_P2 : BOSS_MECH.GUARD_INTERVAL;
          }
          break;
        default: {                      // 巡逻
          b.x += b.dir * spd;
          if (b.x <= minX) { b.x = minX; b.dir = 1; }
          else if (b.x >= maxX) { b.x = maxX; b.dir = -1; }
          if (!engaged) break;
          b.nextAttack -= sf;
          if (b.nextAttack <= 0) {
            const t = this.nearestPlayer(b.x + b.w / 2, b.y + b.h / 2);
            let dir = t.x < b.x + b.w / 2 ? -1 : 1;
            // 贴墙时换向，避免冲撞直接撞在墙上原地结束
            if (dir < 0 && b.x <= minX + 40) dir = 1;
            else if (dir > 0 && b.x >= maxX - 40) dir = -1;
            b.dir = dir;
            b.chargeDir = dir;
            b.nextKind = b.nextKind === 1 ? 2 : 1;
            b.act = 1;
            b.actT = BOSS_MECH.GUARD_WINDUP;
            Sound.laser();
          }
        }
      }
    },

    // 终焉星核：星核弹幕 + 核心光柱
    updateBossCore(b, spd, sf, engaged) {
      const minX = b.platform.x;
      const maxX = b.platform.x + b.platform.w - b.w;
      switch (b.act) {
        case 1:                         // 弹幕蓄力
          b.actT -= sf;
          if (b.actT <= 0) {
            this.spawnCoreOrbs(b);
            b.act = 3;
            b.actT = BOSS_MECH.CORE_VOLLEY_RECOVER;
          }
          break;
        case 4: {                       // 光柱蓄力
          b.actT -= sf;
          if (b.actT <= 0) {
            const t = this.nearestPlayer(b.x + b.w / 2, b.y + b.h / 2);
            b.beamX = Math.round(Math.max(
              b.platform.x + 24,
              Math.min(b.platform.x + b.platform.w - 24, t.x + t.w / 2)));
            const warn = b.phase === 2 ? 32 : BOSS_MECH.CORE_BEAM_WINDUP;
            this.projectiles.push({
              x: b.beamX - BOSS_MECH.CORE_BEAM_W / 2, y: 120,
              w: BOSS_MECH.CORE_BEAM_W, h: GROUND_Y - 120,
              vx: 0, vy: 0, kind: 'beamwarn', life: warn
            });
            b.beamDelay = warn;
            b.act = 3;
            b.actT = BOSS_MECH.CORE_BEAM_RECOVER;
            Sound.laser();
          }
          break;
        }
        case 3:                         // 硬直
          b.actT -= sf;
          if (b.actT <= 0) {
            b.act = 0;
            b.nextAttack = b.phase === 2
              ? BOSS_MECH.CORE_INTERVAL_P2 : BOSS_MECH.CORE_INTERVAL;
          }
          break;
        default: {                      // 缓慢巡逻
          b.x += b.dir * spd * 0.7;
          if (b.x <= minX) { b.x = minX; b.dir = 1; }
          else if (b.x >= maxX) { b.x = maxX; b.dir = -1; }
          if (!engaged) break;
          b.nextAttack -= sf;
          if (b.nextAttack <= 0) {
            b.nextKind = b.nextKind === 1 ? 2 : 1;
            b.act = b.nextKind === 1 ? 1 : 4;
            b.actT = b.nextKind === 1
              ? BOSS_MECH.CORE_VOLLEY_WINDUP : BOSS_MECH.CORE_BEAM_WINDUP;
          }
        }
      }
    },

    // 震地波：向左右两侧各发出一个贴地能量波
    spawnGuardianWaves(b) {
      const y = GROUND_Y - 26;
      for (const dir of [-1, 1]) {
        this.projectiles.push({
          x: dir < 0 ? b.x - 18 : b.x + b.w - 16,
          y, w: 34, h: 26,
          vx: dir * BOSS_MECH.GUARD_WAVE_SPEED * (b.phase === 2 ? 1.2 : 1),
          vy: 0, kind: 'wave', life: BOSS_MECH.GUARD_WAVE_LIFE
        });
      }
      Particles.dust(b.x + b.w / 2, GROUND_Y);
      this.addPopup(b.x + b.w / 2, b.y - 20, '震地!', '#ffb066');
    },

    // 星核弹幕：以最近玩家为方向发射扇形弹体
    spawnCoreOrbs(b) {
      const t = this.nearestPlayer(b.x + b.w / 2, b.y + b.h / 2);
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const base = Math.atan2(t.y + t.h / 2 - cy, t.x + t.w / 2 - cx);
      const n = b.phase === 2 ? 5 : 3;
      for (let i = 0; i < n; i++) {
        const ang = base + (i - (n - 1) / 2) * 0.2;
        this.projectiles.push({
          x: cx - 6, y: cy - 6, w: 12, h: 12,
          vx: Math.cos(ang) * BOSS_MECH.CORE_ORB_SPEED,
          vy: Math.sin(ang) * BOSS_MECH.CORE_ORB_SPEED,
          kind: 'orb', life: 260
        });
      }
      Sound.spike();
    },

    // 预警结束后落下的核心光柱
    spawnCoreBeam(b) {
      this.projectiles.push({
        x: b.beamX - BOSS_MECH.CORE_BEAM_W / 2, y: 120,
        w: BOSS_MECH.CORE_BEAM_W, h: GROUND_Y - 120,
        vx: 0, vy: 0, kind: 'beam', life: BOSS_MECH.CORE_BEAM_ON
      });
      Particles.dust(b.beamX, GROUND_Y);
      Sound.laser();
    },


    // 二阶段召唤：在 Boss 附近生成一只小型巡逻怪
    summonMinion() {
      const b = this.boss;
      if (!b || !b.alive) return;
      if (this.enemies.filter((e) => e.alive && e.sum).length >= MECH.SUMMON_CAP) return;
      const plat = b.platform;
      let x = b.x + (b.dir > 0 ? -40 : b.w + 14);
      x = Math.max(plat.x + 4, Math.min(plat.x + plat.w - ENEMY_SIZE.w, x));
      this.enemies.push({
        x, y: plat.y - ENEMY_SIZE.h,
        w: ENEMY_SIZE.w, h: ENEMY_SIZE.h,
        dir: -b.dir, speed: 1.35 * Storage.enemySpeedMul(),
        baseSpeed: 1.35 * Storage.enemySpeedMul(),
        anim: 0, platform: plat,
        alive: true, deadTimer: 0, sum: true
      });
      Particles.enemyChunks(x + ENEMY_SIZE.w / 2, plat.y - 10);
      this.addPopup(x + ENEMY_SIZE.w / 2, plat.y - 40, '增援!', '#ff9aa8');
      Sound.bossHit();
    },

    // 检查点重生位置：Boss 战从 Boss 房入口，否则回最近检查点（无检查点回起点）
    spawnPoint() {
      if (this.bossFightStarted && this.bossArena) return this.bossArena;
      if (this.activeCheckpoint >= 0) {
        const c = this.checkpoints[this.activeCheckpoint];
        return { x: c.x - PLAYER_SIZE.w / 2, y: c.y - PLAYER_SIZE.h };
      }
      return this.data.spawn;
    },

    // 进入 Boss 房时记录，死亡后统一从 Boss 房入口重生
    checkBossArena() {
      if (this.bossFightStarted || !this.bossArena) return;
      if (players.some((p) => p.x >= this.bossArena.x)) {
        this.bossFightStarted = true;
        this.bossIntroT = 100;      // 入场演出期间 Boss 保持克制
        Game.shake = Math.max(Game.shake, 5);
      }
    },

    // 检查点快照：记录金币数与金币状态、敌人位置 / 朝向 / 存活
    captureSnapshot(coins) {
      const snap = { coins: 0, coinStates: [], enemies: [] };
      if (CHECKPOINT.SNAPSHOT_COINS) {
        snap.coins = coins;
        snap.coinStates = this.coins.map((c) => c.collected);
      }
      if (CHECKPOINT.SNAPSHOT_ENEMIES) {
        const cpX = this.activeCheckpoint >= 0
          ? this.checkpoints[this.activeCheckpoint].x : 0;
        snap.enemies = this.enemies.map((e) => ({
          x: e.x, y: e.y, dir: e.dir, anim: e.anim,
          alive: e.alive, before: e.x < cpX
        }));
      }
      this.snapshot = snap;
    },

    // 死亡重生回滚：金币与金币状态、敌人状态（检查点之前的敌人复活）
    restoreSnapshot() {
      // 先移除 Boss 二阶段召唤物，保证敌人索引与快照一致
      this.enemies = this.enemies.filter((e) => !e.sum);
      const snap = this.snapshot;
      if (!snap) {
        this.resetEnemies();
        this.resetCoins();
        return;
      }
      if (CHECKPOINT.SNAPSHOT_COINS) {
        for (let i = 0; i < this.coins.length; i++) {
          this.coins[i].collected = !!(snap.coinStates && snap.coinStates[i]);
        }
      }
      if (CHECKPOINT.SNAPSHOT_ENEMIES) {
        for (let i = 0; i < this.enemies.length; i++) {
          const e = this.enemies[i];
          const s = snap.enemies[i];
          if (!s) continue;
          e.x = s.x; e.y = s.y; e.dir = s.dir; e.anim = s.anim;
          // 检查点之前的敌人重置为存活；之后的保持死亡时的存活 / 消灭状态
          if (s.before) { e.alive = true; e.deadTimer = 0; }
        }
      }
    },

    // 重置下坠平台 / 弹跳板状态（死亡重生或重开本关时调用）
    resetFallPlats() {
      for (const f of this.fallPlats) {
        f.state = 'idle';
        f.timer = 0;
        f.alpha = 1;
        f.respawn = 0;
      }
      for (const p of this.pads) {
        p.squash = 0;
        p.cool = 0;
      }
    },

    // 下坠平台：被踩 1 秒后消失，离开立即重置计时，消失后延时复原
    updateFallPlats() {
      for (const f of this.fallPlats) {
        if (f.state === 'gone') {
          const elapsed = MECH.FALL_RESPAWN - f.respawn;
          f.alpha = elapsed < MECH.FALL_FADE
            ? Math.max(0, 1 - elapsed / MECH.FALL_FADE)
            : 0;
          f.respawn--;
          if (f.respawn <= 0) {
            f.state = 'idle';
            f.timer = 0;
            f.alpha = 1;
          }
          continue;
        }
        // 任一玩家踩在平台上时开始计时
        if (players.some((p) => p.groundObj === f)) {
          f.timer++;
          if (f.timer >= MECH.FALL_DELAY) {
            f.state = 'gone';
            f.respawn = MECH.FALL_RESPAWN;
            f.alpha = 1;
            Particles.dust(f.x + f.w / 2, f.y + 4);
            Sound.land();
          }
        } else {
          f.timer = Math.max(0, f.timer - 2);   // 离开后快速重置
        }
      }
    },

    // 陷阱更新：火球发射、激光周期、捕兽夹状态、滚锯巡逻、摆锤摆动与弹体移动
    updateTraps() {
      // 胆小鬼模式：所有陷阱停用（不发射、不夹合、激光常闭）
      if (COWARD.TRAPS_OFF && Storage.coward() && !Game.multiplayer) {
        this.projectiles = [];
        for (const t of this.traps) {
          t.active = false; t.warn = false;
          t.fireTimer = 0; t.snap = 0; t.cool = 0;
        }
        return;
      }
      const sf = Game.slowFactor || 1;   // 时间减速道具：陷阱节奏同步变慢
      for (const t of this.traps) {
        // 接近启用：任一玩家进入范围后陷阱才开始工作
        const near = players.some((p) =>
          p.x > t.x - TRAP.ARM_RANGE && p.x < t.x + t.w + TRAP.ARM_RANGE);
        if (!t.armed) {
          if (!near) { t.active = false; t.warn = false; continue; }
          t.armed = true;
          if (t.kind === 'laser') t.timer = TRAP.LASER_PERIOD - TRAP.LASER_WARN;
          if (t.kind === 'fire') t.fireTimer = TRAP.FIRE_INTERVAL - 50;
        }
        if (t.kind === 'fire') {
          t.fireTimer += sf;
          if (t.fireTimer >= TRAP.FIRE_INTERVAL) {
            t.fireTimer = 0;
            const fs = TRAP.FIRE_SIZE;
            this.projectiles.push({
              x: t.dir > 0 ? t.x + t.w : t.x - fs,
              y: t.y + 6, w: fs, h: fs,
              vx: t.dir * TRAP.FIRE_SPEED * sf
            });
          }
        } else if (t.kind === 'laser') {
          const wasActive = t.active;
          t.timer = (t.timer + sf) % TRAP.LASER_PERIOD;
          t.active = t.timer < TRAP.LASER_ON;
          t.warn = !t.active && t.timer >= TRAP.LASER_PERIOD - TRAP.LASER_WARN;
          if (t.active && !wasActive) Sound.laser();
        } else if (t.kind === 'bear') {
          if (t.snap > 0) t.snap = Math.max(0, t.snap - sf);
          if (t.cool > 0) t.cool = Math.max(0, t.cool - sf);
        } else if (t.kind === 'saw') {
          // 滚锯：沿地面来回巡逻
          t.timer += sf;
          t.x = t.baseX + Math.sin(t.timer * t.speed) * t.range;
        } else if (t.kind === 'pendulum') {
          // 摆锤：按正弦角度摆动，球体位置实时计算
          t.timer += sf;
          t.angle = Math.sin(t.timer * t.speed) * t.amp;
          t.x = t.pivotX + Math.sin(t.angle) * t.len - t.w / 2;
          t.y = t.pivotY + Math.cos(t.angle) * t.len - t.h / 2;
        } else if (t.kind === 'crusher') {
          // 落锤：悬停 → 警示 → 砸下 → 停留 → 收回
          const wasActive = t.active;
          t.timer = (t.timer + sf) % TRAP.CRUSHER_PERIOD;
          const ph = t.timer;
          const drop = GROUND_Y - TRAP.CRUSHER_H - t.baseY;
          if (ph < 60) {
            t.y = t.baseY;
            t.active = false;
            t.warn = ph >= 60 - TRAP.CRUSHER_WARN;
          } else if (ph < 82) {
            t.y = t.baseY + drop * ((ph - 60) / 22);
            t.active = true;
            t.warn = false;
          } else if (ph < 118) {
            t.y = t.baseY + drop;
            t.active = true;
            t.warn = false;
          } else {
            t.y = t.baseY + drop * (1 - (ph - 118) / (TRAP.CRUSHER_PERIOD - 118));
            t.active = false;
            t.warn = false;
          }
          if (t.active && !wasActive) Sound.land();
        } else if (t.kind === 'popspike') {
          // 地刺：隐藏 → 警示 → 弹出 → 停留 → 缩回
          const wasActive = t.active;
          t.timer = (t.timer + sf) % TRAP.SPIKE_PERIOD;
          const ph = t.timer;
          if (ph < 60) {
            t.y = t.baseY;
            t.active = false;
            t.warn = ph >= 60 - TRAP.SPIKE_WARN;
          } else if (ph < 78) {
            t.y = t.baseY - TRAP.SPIKE_H * ((ph - 60) / 18);
            t.active = true;
            t.warn = false;
          } else if (ph < 118) {
            t.y = t.baseY - TRAP.SPIKE_H;
            t.active = true;
            t.warn = false;
          } else {
            t.y = t.baseY - TRAP.SPIKE_H * (1 - (ph - 118) / (TRAP.SPIKE_PERIOD - 118));
            t.active = false;
            t.warn = false;
          }
          if (t.active && !wasActive) Sound.spike();
        }
      }
      for (const p of this.projectiles) {
        p.x += p.vx;
        p.y += (p.vy || 0);
        if (p.kind === 'rock' && p.y > GROUND_Y + 8) p.life = 0;
        if (p.life !== undefined) p.life--;
      }
      this.projectiles = this.projectiles.filter(
        (p) => p.x > -60 && p.x < this.data.width + 60 &&
               p.y > -60 && p.y < 760 &&
               (p.life === undefined || p.life > 0)
      );
    },

    // 重生时清理弹体与陷阱状态
    resetTraps() {
      this.projectiles = [];
      for (const t of this.traps) {
        t.fireTimer = 0;
        t.timer = 0;
        t.active = false;
        t.warn = false;
        t.snap = 0;
        t.cool = 0;
        t.armed = false;
        if (t.kind === 'saw') t.x = t.baseX;
        if (t.kind === 'pendulum') {
          t.angle = 0;
          t.x = t.pivotX - t.w / 2;
          t.y = t.pivotY + t.len - t.h / 2;
        }
        if (t.kind === 'crusher' || t.kind === 'popspike') {
          t.timer = 0;
          t.y = t.baseY;
          t.active = false;
          t.warn = false;
        }
      }
    },

    // 熔岩上涨：从起点缓慢上升到上限
    updateLava() {
      if (!this.lava) return;
      const spd = this.lava.speed *
        (Storage.coward() && !Game.multiplayer ? COWARD.LAVA_SPEED : 1);
      if (this.lava.y > this.lava.cap) {
        this.lava.y = Math.max(this.lava.cap, this.lava.y - spd);
      }
    },
    resetLava() {
      if (this.lava) this.lava.y = this.biome.lava.start;
    },

    // 周期强风计时：返回当前阶段与参数（0 平静 / 1 预警 / 2 强风）
    gustCycle() {
      const g = this.biome && this.biome.gust;
      if (!g) return null;
      const period = Math.max(80, g.period || 300);
      const on = Math.min(period, g.on || 120);
      const warn = Math.min(60, period - on);
      return {
        g, period, on, warn,
        ph: Game.tick % period,
        strength: g.strength || 0.3
      };
    },
    gustPhase() {
      const c = this.gustCycle();
      if (!c) return 0;
      if (c.ph < c.period - c.on - c.warn) return 0;
      if (c.ph < c.period - c.on) return 1;
      return 2;
    },
    gustPower() {
      const c = this.gustCycle();
      if (!c) return 0;
      const t = c.ph - (c.period - c.on);
      if (t < 0) return 0;
      if (t < 26) return c.strength * (t / 26);
      if (t > c.on - 26) return c.strength * Math.max(0, (c.on - t) / 26);
      return c.strength;
    },

    // 机关门：触碰开关后门体升起并取消碰撞
    updateGates() {
      for (const g of this.gates) {
        if (!g.opened && players.some((p) => aabb(p, g.switch))) {
          g.opened = true;
          Sound.gate();
          Particles.dust(g.switch.x + g.switch.w / 2, g.switch.y);
          this.addPopup(g.x + g.w / 2, g.baseY - 16, '机关门开启', '#7ff0a8');
        }
        if (g.opened && g.openT < 1) {
          g.openT = Math.min(1, g.openT + 0.06);
          g.y = g.baseY - g.openT * (g.h + 8);
        }
      }
    },

    // 弹跳板：踩上后自动高弹，带压缩动画
    updatePads() {
      for (const pad of this.pads) {
        if (pad.squash > 0) pad.squash--;
        if (pad.cool > 0) pad.cool--;
        for (const p of players) {
          const feet = p.y + p.h;
          const over = p.x + p.w > pad.x && p.x < pad.x + pad.w;
          if (over && p.vy >= 0 && pad.cool <= 0 &&
              feet >= pad.y - 8 && feet <= pad.y + 16) {
            p.vy = MECH.BOUNCE_VELOCITY;
            p.onGround = false;
            p.jumpsLeft = p.maxJumps();
            // 起跳瞬间短暂无敌，避免弹起途中被敌人 / 陷阱贴脸判定
            p.invuln = Math.max(p.invuln, FEEL.PAD_GRACE);
            pad.squash = MECH.PAD_SQUASH_FRAMES;
            pad.cool = MECH.PAD_COOLDOWN;
            Sound.bounce();
            Particles.dust(pad.x + pad.w / 2, pad.y - 4);
            Particles.bounceDraft(pad.x + pad.w / 2, pad.y - 18);
            break;
          }
        }
      }
    },

    // 检查点：触达后激活并记录，返回本次新激活的下标（无则 -1）
    updateCheckpoints() {
      const t = { x: 0, y: 0, w: CHECKPOINT.TRIGGER_W, h: CHECKPOINT.TRIGGER_H };
      // 硬核难度：检查点数量减半（只保留偶数序号）
      const step = Storage.diff().checkpointStep;
      for (let i = 0; i < this.checkpoints.length; i++) {
        if (step > 1 && i % step !== 0) continue;
        const c = this.checkpoints[i];
        if (c.activated) continue;
        t.x = c.x - CHECKPOINT.TRIGGER_W / 2;
        t.y = c.y - CHECKPOINT.TRIGGER_H;
        if (players.some((p) => aabb(p, t))) {
          c.activated = true;
          this.activeCheckpoint = i;
          return i;
        }
      }
      return -1;
    },

    // 二段跳光环 / 效果更新
    addRing(x, y) {
      this.rings.push({ x, y, r: 6, life: 20, maxLife: 20 });
    },
    updateRings() {
      for (const r of this.rings) {
        r.r += 2.4;
        r.life--;
      }
      this.rings = this.rings.filter((r) => r.life > 0);
    },

    // 首次机制提示：玩家经过后标记已读
    updateHints() {
      for (const h of this.hints) {
        if (!h.seen && players.some((p) => p.x > h.x + 90)) h.seen = true;
      }
    },

    // Boss 被击败：在其原位置生成终点旗帜，并清除残留攻击
    spawnFlagAfterBoss() {
      this.bossDefeated = true;
      this.projectiles = this.projectiles.filter((p) =>
        p.kind !== 'wave' && p.kind !== 'orb' &&
        p.kind !== 'beam' && p.kind !== 'beamwarn');
      const b = this.boss;
      this.flag = { x: b.x + b.w / 2 - 2, y: 374, w: 5, h: 96 };
      this.flagTrigger = { x: b.x + b.w / 2 - 30, y: 356, w: 70, h: 114 };
    },

    addPopup(x, y, text, color) {
      this.popups.push({ x, y, vy: -1.2, life: 50, text, color: color || '#ffe28a' });
    },

    updatePopups() {
      for (const p of this.popups) {
        p.y += p.vy;
        p.life--;
      }
      this.popups = this.popups.filter((p) => p.life > 0);
    }
  };

  // ============================================================
  // 5.5 无尽模式：按房间号程序化生成关卡数据
  //     - 复用现有 ground / ledge / oneWay / mover / coin 工厂
  //     - 难度随房间数递增：敌人种类、敌人速度、陷阱密度
  // ============================================================
  function seededRandom(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  const Endless = {
    // runSeed 让每一次无尽开局的房间布局不同；同一局内按房间号可复现
    // 复用第二篇章的手工章节库（ACT_SECTIONS），随机拼接成短房间
    build(room, runSeed) {
      const rnd = seededRandom(0x9e3779b9 ^ (room * 7919) ^
        (((runSeed || 0) * 2654435761) >>> 0));
      const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
      const target = Math.min(ENDLESS.MAX_WIDTH,
        ENDLESS.BASE_WIDTH + (room - 1) * ENDLESS.WIDTH_STEP);

      // 章节状态：与第二篇章关卡生成器共用
      const S = {
        plats: [], coins: [], spikes: [], traps: [],
        fallPlats: [], pads: [], grounds: [], highs: [],
        x: 0, gem: null, arena: null, boss: null, flagX: null, bossDef: null
      };
      ACT_SECTIONS.start(S);

      // 每 5 间一个首领房：暗星守卫与终焉星核交替镇守，血量/速度随房间增长
      const bossRoom = room % 5 === 0;
      if (bossRoom) {
        S.bossDef = {
          hp: Math.min(24, 8 + Math.floor(room / 5) * 2),
          speed: Math.min(2.4, 1.5 + room * 0.03),
          style: (Math.floor(room / 5) % 2 === 1) ? 'guardian' : 'core'
        };
      }

      // 随房间解锁章节与陷阱预算
      const basePool = ['flat', 'pit', 'stairs', 'fall', 'bridge', 'pad', 'tower'];
      const trapPool = [];
      if (room >= 2) basePool.push('mover', 'spike');
      if (room >= 3) trapPool.push('saw');
      if (room >= 4) trapPool.push('crusher');
      if (room >= 5) trapPool.push('laser', 'pendulum');
      if (room >= 6) trapPool.push('popspike');
      let trapBudget = Math.min(ENDLESS.TRAP_CAP, 1 + Math.floor(room / 2));
      let last = '';

      const reserve = bossRoom ? 1080 : 460;
      while (S.x < target - reserve) {
        const pool = trapBudget > 0 ? basePool.concat(trapPool) : basePool;
        let type = pool[Math.floor(rnd() * pool.length)];
        if (type === last && pool.length > 1) {
          type = pool[(pool.indexOf(type) + 1) % pool.length];
        }
        last = type;
        const gap = ri(120, 180);
        if (type === 'flat') {
          ACT_SECTIONS.flat(S, gap, ri(260, 360),
            room >= 2 && rnd() < 0.45 ? 1 : 0);
          // 保留少量捕兽夹，让休闲难度也有可用的地面陷阱
          if (room >= 3 && trapBudget > 0 && rnd() < 0.35) {
            S.traps.push({ kind: 'bear', x: Math.round(S.x - 160) });
            trapBudget--;
          }
        } else if (type === 'pit') {
          ACT_SECTIONS.pit(S, ri(150, 200), ri(260, 340));
        } else if (type === 'stairs') {
          ACT_SECTIONS.stairs(S, ri(130, 180), ri(2, 3), ri(260, 320));
        } else if (type === 'mover') {
          // 纵移平台在第 4 间起出现，并限制振幅，避免随机组合出过高的落差
          const axis = room < 4 ? 'x' : (rnd() < 0.55 ? 'x' : 'y');
          const range = axis === 'y' ? ri(48, 62) : ri(55, 90);
          ACT_SECTIONS.mover(S, ri(200, 240), axis, range, ri(260, 340));
        } else if (type === 'fall') {
          ACT_SECTIONS.fall(S, ri(230, 290), ri(260, 320));
        } else if (type === 'bridge') {
          ACT_SECTIONS.bridge(S, ri(130, 180), ri(2, 4), ri(260, 340));
        } else if (type === 'pad') {
          ACT_SECTIONS.pad(S, ri(120, 180), ri(280, 380));
        } else if (type === 'tower') {
          ACT_SECTIONS.tower(S, ri(130, 180), ri(260, 340), ri(2, 4));
        } else if (type === 'spike') {
          ACT_SECTIONS.spike(S, ri(130, 180), ri(300, 380),
            ri(1, room >= 6 ? 3 : 2));
        } else if (type === 'saw') {
          ACT_SECTIONS.saw(S, ri(130, 180), ri(300, 360));
          trapBudget--;
        } else if (type === 'crusher') {
          const n = 1 + (room >= 8 && trapBudget > 1 ? 1 : 0);
          ACT_SECTIONS.crusher(S, ri(130, 180), ri(300, 360), n);
          trapBudget -= n;
        } else if (type === 'popspike') {
          ACT_SECTIONS.popspike(S, ri(130, 180), ri(300, 360), 1);
          trapBudget--;
        } else if (type === 'laser') {
          ACT_SECTIONS.laser(S, ri(130, 180), ri(300, 360));
          trapBudget--;
        } else if (type === 'pendulum') {
          ACT_SECTIONS.pendulum(S, ri(130, 180), ri(300, 360));
          trapBudget--;
        }
      }
      // 终点段：首领房以 Boss 房收尾，普通房按目标宽度补齐终点地面
      if (bossRoom) {
        ACT_SECTIONS.arena(S, ri(140, 190));
      } else {
        const fgap = ri(120, 170);
        const fx = S.x + fgap;
        const flen = Math.max(380, target - fx);
        a2Ground(S, fx, flen);
        a2Coins(S, fx + 40, GROUND_Y - 50,
          Math.min(5, Math.max(3, Math.round(flen / 90))), 40);
        S.x = fx + flen;
        S.flagX = S.x - 40;
      }
      const width = Math.max(2000, S.x);

      // 敌人种类随房间逐步解锁
      const types = ['walker'];
      if (room >= 2) types.push('hopper');
      if (room >= 3) types.push('charger');
      if (room >= 4) types.push('flyer');
      if (room >= 5) types.push('spiky');
      if (room >= 8) types.push('armored');
      if (room >= 10) types.push('shooter');
      if (room >= 12) types.push('ghost');

      const enemies = [];
      const cap = Math.min(ENDLESS.ENEMY_CAP, 3 + Math.floor(room * 0.7));
      const stopX = S.arena ? S.arena.x - 140 : width - 320;
      let total = 0;
      for (const g of S.grounds) {
        if (total >= cap) break;
        if (g.x < 500 || g.x > stopX) continue;
        const per = 1 + (room >= 4 ? 1 : 0) + (room >= 9 ? 1 : 0);
        for (let k = 0; k < per && total < cap; k++) {
          const span = Math.max(40, g.w - 130);
          enemies.push({
            platform: g.index,
            x: g.x + 60 + ((total * 53 + k * 131) % span),
            dir: total % 2 === 0 ? 1 : -1,
            speed: 0.85 + rnd() * 0.35,
            type: types[total % types.length],
            elite: room >= 6 && total % 4 === 1
          });
          total++;
        }
      }

      // 检查点：房间中段附近的实地（首领房排除 Boss 房入口之后的地面）
      const cpEnd = S.arena ? S.arena.x - 80 : width;
      const cpCands = S.grounds.filter((g) => g.x + g.w < cpEnd);
      const mid = Math.round(width / 2);
      let cpGround = cpCands.find((g) =>
        g.x < mid && g.x + g.w > mid + 30);
      if (!cpGround) cpGround = cpCands[Math.floor(cpCands.length * 0.5)] || cpCands[0] || S.grounds[0];
      const cpX = Math.round(cpGround.x +
        Math.min(cpGround.w - 40, Math.max(30, cpGround.w * 0.5)));
      const checkpoints = [{ x: cpX, y: GROUND_Y }];

      // 每 3 间一个爱心，每 4 间一个变大果实（位置夹在检查点地面内）
      const hearts = [];
      const fruits = [];
      if (room % 3 === 0) {
        hearts.push({
          x: Math.min(cpGround.x + cpGround.w - 30, cpX + 60),
          y: GROUND_Y - 40
        });
      }
      if (room % 4 === 0) {
        fruits.push({
          x: Math.min(cpGround.x + cpGround.w - 40, cpX + 150),
          y: GROUND_Y - 90
        });
      }

      return {
        name: bossRoom
          ? '无尽 · 第 ' + room + ' 间 · 首领'
          : '无尽 · 第 ' + room + ' 房间',
        tip: bossRoom
          ? '击败首领后才会出现终点旗帜'
          : '难度随房间递增，抵达终点旗进入下一间',
        width,
        spawn: { x: 60, y: GROUND_Y - PH },
        enemyTypes: types,
        platforms: S.plats,
        coins: S.coins,
        spikes: S.spikes,
        enemies,
        traps: S.traps.slice(0, ENDLESS.TRAP_CAP),
        hearts,
        fruits,
        pads: S.pads,
        checkpoints,
        fallPlats: S.fallPlats,
        hints: [],
        flag: bossRoom ? null : { x: S.flagX, y: 374, w: 5, h: 96 },
        flagTrigger: bossRoom ? null : { x: S.flagX - 24, y: 356, w: 70, h: 114 },
        boss: S.boss,
        bossArena: S.arena,
        biome: {}
      };
    }
  };

  // ============================================================
  // 6. 物理 / 碰撞模块：轴分离解算（保持原实现）
  // ============================================================
  const Physics = {
    resolveHorizontal(actor, solids) {
      for (const s of solids) {
        if (s.oneWay) continue;          // 单向平台不阻挡水平移动
        if (s.gate && s.opened) continue; // 机关门开启后不再阻挡
        if (!aabb(actor, s)) continue;
        if (actor.vx > 0) actor.x = s.x - actor.w;
        else if (actor.vx < 0) actor.x = s.x + s.w;
        if (actor.vx !== 0) actor.vx = 0;
      }
    },

    resolveVertical(actor, solids) {
      const prevGround = actor.groundObj;   // 上一帧站立对象（吸附判定用）
      actor.onGround = false;
      actor.groundObj = null;            // 记录当前站立对象（下坠平台 / 单向平台判定用）
      for (const s of solids) {
        if (s.gate && s.opened) continue; // 机关门开启后不再参与碰撞
        // 单向平台：只在下落且脚底原本在平台面之上时接住
        if (s.oneWay) {
          if (actor.vy <= 0) continue;
          if (actor.dropTimer && actor.dropTimer > 0) continue;
          if (!aabb(actor, s)) continue;
          const prevBottom = (actor.prevY === undefined ? actor.y - actor.vy : actor.prevY) + actor.h;
          if (prevBottom > s.y + 6) continue;
          actor.y = s.y - actor.h;
          actor.vy = 0;
          actor.onGround = true;
          actor.groundObj = s;
          continue;
        }
        // 下坠平台消失后不再参与碰撞
        if (s.fall && s.state === 'gone') continue;
        if (!aabb(actor, s)) {
          // 吸附容差：脚底仍在该平台水平范围内（含 2px 边缘宽容）时贴回顶部，
          // 超出宽容范围则正常掉落，避免“走在空中”
          const nearX = actor.x + actor.w + FEEL.EDGE_GRACE > s.x &&
                        actor.x - FEEL.EDGE_GRACE < s.x + s.w;
          if (prevGround === s && nearX && actor.vy >= 0) {
            const gap = actor.y + actor.h - s.y;
            if (gap >= 0 && gap <= MECH.PLATFORM_SNAP) {
              actor.y = s.y - actor.h;
              actor.vy = 0;
              actor.onGround = true;
              actor.groundObj = s;
            }
          }
          continue;
        }
        if (actor.vy > 0) {
          actor.y = s.y - actor.h;
          actor.vy = 0;
          actor.onGround = true;
          actor.groundObj = s;
        } else if (actor.vy < 0) {
          actor.y = s.y + s.h;
          actor.vy = 0.4;
          // 撞到平台底部后短暂无敌，避免同帧被下方敌人 / 陷阱 / 尖刺连带扣血
          if (actor.invuln !== undefined) {
            actor.invuln = Math.max(actor.invuln, FEEL.CEILING_GRACE);
          }
        }
      }
    }
  };

  // ============================================================
  // 7. 玩家模块：移动、跳跃、二段跳、冲刺、生命
  // ============================================================
  const player = {
    id: 0,            // 队伍中的玩家编号
    hearts: PHYS.START_LIVES, // 个人生命（多人模式每人独立）
    shield: 0,        // 个人护盾层数
    input: null,      // 远程 / 额外玩家的输入；null = 使用本地键盘 Input
    visualId: 0,      // 用于配色区分
    x: 0, y: 0,
    prevY: 0,         // 上一帧的 y（用于踩头判定，避免 vy 被碰撞清零后误判）
    w: PLAYER_SIZE.w, h: PLAYER_SIZE.h,
    vx: 0, vy: 0,
    onGround: false,
    groundObj: null,       // 当前站立的平台（下坠 / 单向平台交互用）
    dropTimer: 0,          // 单向平台下穿剩余帧数
    big: false,            // 是否处于变大状态（受伤一次后变小）
    facing: 1,
    jumpsLeft: PHYS.MAX_JUMPS,
    coyote: 0, jumpBuffer: 0,
    invuln: 0,
    dashTime: 0,      // 冲刺剩余帧数
    dashDir: 1,
    dashCd: 0,        // 冲刺冷却
    dashInertia: 0,   // 冲刺结束后的惯性剩余帧数
    landStun: 0,      // 落地硬直剩余帧数
    runDustCd: 0,     // 跑步扬尘计时
    flash: 0,         // 受击闪白剩余帧数

    // 能力加成：最大跳跃次数 / 冲刺冷却 / 超级跳倍率
    // 联机客人本地预测时使用房主下发的权威数值（netMaxJumps 等）
    maxJumps() {
      if (Game.multiplayer && this.netMaxJumps !== undefined) return this.netMaxJumps;
      return PHYS.MAX_JUMPS + (Storage.data.upgrades.jump ? 1 : 0);
    },
    dashCdFrames() {
      if (Game.multiplayer && this.netDashCd !== undefined) return this.netDashCd;
      return Math.round(DASH.COOLDOWN *
        (1 - (Storage.data.upgrades.dash || 0) * 0.15));
    },
    jumpBoost() {
      return Game.levelItem === 'super' ? 1.2 : 1;
    },

    reset(spawn) {
      const s = spawn || Level.data.spawn;
      this.x = s.x; this.y = s.y;
      this.prevY = s.y;
      this.vx = 0; this.vy = 0;
      this.onGround = true;
      this.groundObj = null;
      this.dropTimer = 0;
      this.big = false;
      this.w = PLAYER_SIZE.w;
      this.h = PLAYER_SIZE.h;
      this.facing = 1;
      this.jumpsLeft = this.maxJumps();
      this.coyote = PHYS.COYOTE_FRAMES;
      this.jumpBuffer = 0;
      this.invuln = 0;
      this.dashTime = 0;
      this.dashCd = 0;
      this.dashInertia = 0;
      this.landStun = 0;
      this.runDustCd = 0;
      this.flash = 0;
    },

    startDash() {
      if (this.dashTime > 0 || this.dashCd > 0) return;
      this.dashTime = DASH.DURATION;
      this.dashDir = this.facing;
      this.dashCd = this.dashCdFrames();
      this.invuln = Math.max(this.invuln, DASH.INVULN);
      this.vy = Math.min(this.vy, 0); // 冲刺瞬间不让重力立刻把人拽下
      this.landStun = 0;             // 冲刺可取消落地硬直 / 跳跃后摇
      Sound.dash();
    },

    // 吃下变大果实：碰撞盒变大，脚底位置保持不变
    grow() {
      if (this.big) return;
      this.big = true;
      this.x -= (BIG_SIZE.w - this.w) / 2;
      this.y -= (BIG_SIZE.h - this.h);
      this.w = BIG_SIZE.w;
      this.h = BIG_SIZE.h;
    },

    // 受伤变小：恢复常规碰撞盒，返回是否发生变小
    shrink() {
      if (!this.big) return false;
      this.x += (this.w - PLAYER_SIZE.w) / 2;
      this.y += (this.h - PLAYER_SIZE.h);
      this.w = PLAYER_SIZE.w;
      this.h = PLAYER_SIZE.h;
      this.big = false;
      return true;
    },

    update() {
      // 每名玩家可绑定独立输入（远程玩家由网络输入驱动）
      const inp = this.input || Input;
      // 记录本帧移动前的 y，供踩头判定使用
      this.prevY = this.y;
      const wasOnGround = this.onGround; // 用于判定「空中落地」

      // ---- 随动：站在移动平台顶部时继承平台本帧位移（水平 + 垂直）----
      // 平台位置已在 Game.update 中先行更新，这里直接叠加差值，避免相对滑动
      if (this.onGround && this.groundObj && this.groundObj.move) {
        this.x += this.groundObj.dx;
        this.y += this.groundObj.dy;
        this.prevY += this.groundObj.dy;
      }

      // ---- 冲刺冷却 ----
      if (this.dashCd > 0) this.dashCd--;

      // ---- 冲刺输入 ----
      if (inp.consumeDash()) this.startDash();

      // ---- 冲刺中的水平速度（带末尾减速）----
      if (this.dashTime > 0) {
        const ease = this.dashTime > DASH.EASE_OUT_FRAMES ? 1 : this.dashTime / DASH.EASE_OUT_FRAMES;
        this.vx = this.dashDir * DASH.SPEED * (0.5 + 0.5 * ease);
        this.dashTime--;
        if (this.dashTime === 0) {
          // 冲刺收尾：保留部分速度形成惯性，并喷出气流拖尾
          this.vx = this.dashDir * DASH.SPEED * DASH.INERTIA_KEEP;
          this.dashInertia = DASH.INERTIA_FRAMES;
          Particles.dashTrail(this.x + this.w / 2, this.y + this.h / 2, this.dashDir);
        }
      } else {
        const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
        const stunned = this.landStun > 0;
        const biome = Level.biome || {};
        const ice = this.onGround && biome.ice;
        // 疾风之靴：移动速度与加速度提升（联机客人使用房主下发的倍率）
        const runMul = (Game.multiplayer && this.netRunMul)
          ? this.netRunMul
          : 1 + 0.06 * Storage.upgrade('swift');
        if (dir !== 0 && !stunned) {
          // 空中控制：上升 100%，下落 70%，避免下落阶段过度漂移
          let ctrl = 1;
          if (!this.onGround) {
            ctrl = this.vy < 0 ? FEEL.AIR_CONTROL_RISE : FEEL.AIR_CONTROL_FALL;
          }
          const groundAccel = PHYS.RUN_ACCEL * (ice ? 0.55 : 1) * runMul;
          this.vx += dir * (this.onGround ? groundAccel : PHYS.AIR_ACCEL * runMul) * ctrl;
          const maxSpeed = this.dashInertia > 0
            ? PHYS.MAX_RUN * DASH.INERTIA_MAX_RATIO * runMul
            : PHYS.MAX_RUN * runMul;
          this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));
          this.facing = dir;
        } else {
          // 落地硬直：短暂忽略方向输入并快速减速
          const groundFric = PHYS.GROUND_FRICTION * (ice ? 0.22 : 1);
          const baseFric = stunned
            ? groundFric
            : (this.onGround ? groundFric : PHYS.AIR_FRICTION);
          let decel = baseFric;
          if (!this.onGround && this.vy >= 0) decel *= FEEL.AIR_FRICTION_FALL;
          if (this.dashInertia > 0) decel += DASH.INERTIA_FRICTION;
          if (this.vx > 0) this.vx = Math.max(0, this.vx - decel);
          else if (this.vx < 0) this.vx = Math.min(0, this.vx + decel);
        }
        if (this.dashInertia > 0) this.dashInertia--;
        // 风区：空中受到持续风力；周期强风会额外提供阵风推力
        if (!this.onGround && (biome.wind || biome.gust)) {
          const wmax = PHYS.MAX_RUN * 1.3 * runMul;
          const gust = Level.gustPower ? Level.gustPower() : 0;
          this.vx = Math.max(-wmax, Math.min(wmax,
            this.vx + (biome.wind || 0) + gust));
        }
      }
      if (this.landStun > 0) this.landStun--;

      // ---- 跳跃（缓冲 + 土狼时间）----
      if (inp.consumeJump()) this.jumpBuffer = PHYS.JUMP_BUFFER_FRAMES;

      if (this.jumpBuffer > 0 && this.onGround && inp.down &&
          this.groundObj && this.groundObj.oneWay) {
        // 单向平台：按住 S（下）+ 跳跃 → 向下穿落
        this.dropTimer = MECH.DROP_THROUGH_FRAMES;
        this.jumpBuffer = 0;
        this.onGround = false;
        this.vy = MECH.DROP_THROUGH_VY;
        Sound.drop();
      } else if (this.jumpBuffer > 0) {
        if ((this.onGround || this.coyote > 0) && this.jumpsLeft > 0) {
          this.vy = PHYS.JUMP_VELOCITY * this.jumpBoost();
          this.jumpsLeft--;
          this.onGround = false;
          this.coyote = 0;
          this.jumpBuffer = 0;
          Sound.jump();
        } else if (!this.onGround &&
                   (this.jumpsLeft > 0 || (Storage.coward() && !Game.multiplayer))) {
          // 胆小鬼模式：空中跳跃次数不消耗，可实现无限连跳（联机时统一关闭）
          this.vy = PHYS.AIR_JUMP_VELOCITY * this.jumpBoost();
          if (Storage.coward() && !Game.multiplayer) this.jumpsLeft = this.maxJumps();
          else this.jumpsLeft--;
          this.jumpBuffer = 0;
          Level.addRing(this.x + this.w / 2, this.y + this.h / 2);  // 二段跳扩散光环
          Sound.doubleJump();
        }
      }
      if (this.jumpBuffer > 0) this.jumpBuffer--;
      if (this.dropTimer > 0) this.dropTimer--;

      // ---- 可变跳跃高度：提前松开跳跃键则截断上升速度（短按跳得低）----
      if (inp.consumeJumpRelease() && this.vy < FEEL.JUMP_CUT_VELOCITY) {
        this.vy = FEEL.JUMP_CUT_VELOCITY;
      }

      // ---- 重力 ----
      this.vy = Math.min(this.vy + PHYS.GRAVITY, PHYS.MAX_FALL);

      // ---- 碰撞：先水平后垂直 ----
      this.x += this.vx;
      Physics.resolveHorizontal(this, Level.platforms);

      const fallSpeed = this.vy;      // 记录落地瞬间的下落速度（解算后会被清零）
      this.y += this.vy;
      Physics.resolveVertical(this, Level.platforms);

      // 落地反馈：硬直 + 减速 + 尘土音效；高处落地按速度触发震屏
      if (!wasOnGround && this.onGround) {
        this.landStun = FEEL.LAND_STUN_FRAMES;
        this.vx *= (1 - FEEL.LAND_STUN_DECEL);
        if (fallSpeed > FEEL.LAND_DUST_FALL) {
          Sound.land();
          Particles.dust(this.x + this.w / 2, this.y + this.h);
        }
        if (fallSpeed >= FEEL.LAND_SHAKE_MIN_FALL) {
          const strength = Math.min(FEEL.LAND_SHAKE_MAX,
            Math.round(fallSpeed - FEEL.LAND_SHAKE_MIN_FALL) + 4);
          Game.shake = Math.max(Game.shake, strength);
        }
      }

      // 跑步扬尘：速度越快，生成间隔越短
      if (this.onGround && Math.abs(this.vx) >= FEEL.RUN_DUST_SPEED) {
        if (this.runDustCd > 0) this.runDustCd--;
        else {
          Particles.dust(this.x + this.w / 2, this.y + this.h);
          this.runDustCd = Math.max(4, Math.round(14 - Math.abs(this.vx) * 1.6));
        }
      } else {
        this.runDustCd = 0;
      }

      // 左右边界
      if (this.x < 0) { this.x = 0; this.vx = 0; }
      if (this.x + this.w > Level.data.width) {
        this.x = Level.data.width - this.w; this.vx = 0;
      }

      // 落地重置跳跃；离开平台消耗土狼时间
      if (this.onGround) {
        this.jumpsLeft = this.maxJumps();
        this.coyote = PHYS.COYOTE_FRAMES;
      } else {
        this.coyote = Math.max(0, this.coyote - 1);
      }

      if (this.invuln > 0) this.invuln--;
      if (this.flash > 0) this.flash--;

      // 记录冲刺残影
      if (this.dashTime > 0) {
        Level.trail.push({ x: this.x, y: this.y, life: 10 });
      }
      for (const t of Level.trail) t.life--;
      Level.trail = Level.trail.filter((t) => t.life > 0);
    }
  };

  // 队伍：players[0] 为本机玩家（沿用原有单例），其余玩家通过原型继承复用同一套物理逻辑
  const players = [player];

  // 独立输入状态（远程玩家 / 本地第二套键位使用；本地玩家直接用全局 Input）
  function makeInputState() {
    return {
      left: false, right: false, up: false, down: false,
      jumpHeld: false, jumpPressed: false, jumpReleased: false,
      dashPressed: false, restartPressed: false, pausePressed: false,
      consumeJump() { const v = this.jumpPressed; this.jumpPressed = false; return v; },
      consumeJumpRelease() { const v = this.jumpReleased; this.jumpReleased = false; return v; },
      consumeDash() { const v = this.dashPressed; this.dashPressed = false; return v; },
      consumePause() { const v = this.pausePressed; this.pausePressed = false; return v; },
      consumeRestart() { const v = this.restartPressed; this.restartPressed = false; return v; }
    };
  }

  // 创建队伍成员（id 从 0 开始；input 为网络/本地第二套输入）
  function createPartyPlayer(id, input) {
    const p = Object.create(player);
    p.id = id;
    p.visualId = id;
    p.input = input || null;
    p.hearts = Storage.startLives();
    p.shield = 0;
    p.extra = id > 0;
    return p;
  }

  // 队伍传送站位：在检查点附近左右错开，避免多人叠在一起
  function partySpawn(index, base) {
    const offs = [0, 26, -26, 52, -52, 78];
    const b = base || Level.spawnPoint();
    return { x: b.x + (offs[index % offs.length] || 0), y: b.y };
  }

  // ============================================================
  // 8. 摄像机
  // ============================================================
  const Camera = {
    x: 0, y: 0,
    update() {
      // 队伍相机：跟随所有玩家的水平包围盒中心
      let minX = Infinity, maxX = -Infinity;
      for (const p of players) {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x + p.w);
      }
      if (!isFinite(minX)) { minX = maxX = player.x; }
      const targetX = (minX + maxX) / 2 - VIEW.W * 0.5;
      this.x += (targetX - this.x) * 0.12;
      this.x = Math.max(0, Math.min(this.x, Level.data.width - VIEW.W));
      this.y = 0;
    },
    reset() { this.x = 0; this.y = 0; }
  };

  // ============================================================
  // 9. 游戏状态机
  // ============================================================
  const Game = {
    // menu | help | settings | levelSelect | gallery | shop | itemSelect
    // levelIntro | playing | paused | dying | dead | win | gameComplete
    state: 'menu',
    lives: PHYS.START_LIVES,
    maxLives: PHYS.START_LIVES, // 当前难度生命上限（HUD 心形数量）
    level: 0,
    coins: 0,              // 当前关金币
    totalCoins: 0,         // 累计金币
    tick: 0,
    introTimer: 0,
    levelTime: 0,          // 本关已用帧数
    levelNoHit: true,      // 本关是否全程未受伤（无伤奖章）
    runTime: 0,            // 本次流程累计用时（闯关结算用）
    confetti: [],          // 通关庆祝粒子（屏幕空间）
    deathMark: null,       // 上次死亡位置虚影
    bossCarry: 0,          // 死亡重生保留的 Boss 已损失血量
    menuSelected: 0,       // 主菜单当前项（与 UI.menuButtons 顺序一致）
    settingsSelected: 0,
    capturingKey: null,    // 设置页正在等待新按键（'jump' / 'dash'）
    levelSel: 0,
    levelAct: 0,           // 选关页当前篇章（0 = 1-16，1 = 17-32）
    galleryTab: 0,         // 图鉴中心页签（0 = 奖章，1 = 怪物）
    pauseSelected: 0,
    themeIndex: 0,         // 当前配色主题（无尽模式也复用）
    levelItem: null,       // 本关临时道具 id
    itemSel: 0,            // 道具选择光标
    shield: 0,             // 护盾层数（道具 + 永久能力）
    slowFactor: 1,         // 时间减速倍率（1 = 正常）
    shopSelected: 0,       // 能力商店光标
    shopMsg: '',           // 商店操作反馈
    endless: false,        // 是否处于无尽模式
    daily: false,          // 是否处于每日挑战（复用无尽流程）
    multiplayer: false,    // 是否处于多人联机模式（大厅/对局）
    endlessRoom: 1,        // 当前无尽房间序号
    endlessSeed: 0,        // 本局随机种子（每局布局不同）
    endlessFinished: false,// 本局无尽是否已结算入账
    reviveUsed: false,     // 本关是否已消耗「不屈意志」
    shake: 0,              // 震屏剩余帧数
    dyingTimer: 0,         // 死亡延迟计时（30 帧 = 0.5 秒）
    deadFade: 0,           // 死亡界面淡入进度
    winFade: 0,            // 过关界面淡入进度

    init() {
      Storage.load();
      Input.init();
      BgTiles.build(THEMES[0]);
      this.state = 'menu';
      this.lives = Storage.startLives();
      this.maxLives = Storage.startLives();
      this.level = 0;
      this.themeIndex = 0;
      this.coins = 0;
      this.totalCoins = 0;
      this.endless = false;
      this.levelItem = null;
    },

    // ---- 存档：刷新历史最高金币 ----
    updateBest() {
      if (this.totalCoins > Storage.data.bestCoins) {
        Storage.data.bestCoins = this.totalCoins;
        Storage.save();
      }
    },

    // 开始整局游戏
    startNewGame() {
      this.lives = Storage.startLives();
      this.maxLives = Storage.startLives();
      this.totalCoins = 0;
      this.runTime = 0;
      this.confetti = [];
      this.deathMark = null;
      this.bossCarry = 0;
      this.level = 0;
      this.endless = false;
      this.daily = false;
      this.levelItem = null;
      this.loadLevel(0);
    },

    // 从关卡选择进入（重新开始该关，金币从 0 计）
    startLevel(idx) {
      this.lives = Storage.startLives();
      this.maxLives = Storage.startLives();
      this.totalCoins = 0;
      this.runTime = 0;
      this.confetti = [];
      this.deathMark = null;
      this.bossCarry = 0;
      this.endless = false;
      this.daily = false;
      this.levelItem = null;
      this.loadLevel(idx);
    },

    // 开始无尽模式：房间逐间生成，生命与金币跨房间保留
    // seed 可选：每日挑战传入固定日期种子
    startEndless(seed) {
      this.lives = Storage.startLives();
      this.maxLives = Storage.startLives();
      this.totalCoins = 0;
      this.runTime = 0;
      this.confetti = [];
      this.deathMark = null;
      this.bossCarry = 0;
      this.endless = true;
      this.daily = false;
      this.endlessRoom = 1;
      this.endlessSeed = seed === undefined
        ? Math.floor(Math.random() * 1e9) : (seed >>> 0);
      this.endlessFinished = false;
      this.levelItem = null;
      this.loadEndlessRoom(1);
    },

    // 每日挑战：同一天使用同一随机种子，记录当日最佳
    startDaily() {
      const key = dailyKey();
      const d = Storage.data.daily ||
        (Storage.data.daily = { date: '', bestRoom: 0, bestCoins: 0 });
      if (d.date !== key) {
        d.date = key;
        d.bestRoom = 0;
        d.bestCoins = 0;
        Storage.save();
      }
      this.startEndless(dailySeed(key));
      this.daily = true;
    },

    // 联机开局（房主）：固定 3 心、无道具、从第 1 关开始
    startMultiplayer(partySize) {
      this.multiplayer = true;
      this.setPartySize(Math.max(1, Math.min(4, partySize | 0)));
      this.endless = false;
      this.daily = false;
      this.levelItem = null;
      this.confetti = [];
      this.deathMark = null;
      this.bossCarry = 0;
      this.totalCoins = 0;
      this.runTime = 0;
      this.level = 0;
      this.themeIndex = 0;
      this.levelTime = 0;
      Level.load(0);
      this.resetParty();
      Particles.clear();
      Camera.reset();
      this.shake = 0;
      BgTiles.build(THEMES[0]);
      this.state = 'levelIntro';
      this.introTimer = 120;
    },

    // 联机客机：按房主下发的关卡与人数准备本地场景（随后由快照驱动）
    prepareGuestLevel(level, partySize) {
      this.multiplayer = true;
      this.endless = false;
      this.levelItem = null;
      this.confetti = [];
      this.deathMark = null;
      this.bossCarry = 0;
      this.coins = 0;
      this.totalCoins = 0;
      this.runTime = 0;
      this.levelTime = 0;
      this.level = level;
      this.themeIndex = level % THEMES.length;
      this.setPartySize(partySize);
      Level.load(level);
      this.resetParty();
      Particles.clear();
      Camera.reset();
      this.shake = 0;
      BgTiles.build(THEMES[this.themeIndex]);
      Music.setLevel(level);
      this.state = 'levelIntro';
      this.introTimer = 120;
    },

    // 加载无尽房间：运行时生成关卡数据后交给 Level.load
    loadEndlessRoom(n) {
      this.endlessRoom = n;
      this.level = 0;
      this.themeIndex = (n - 1) % THEMES.length;
      this.coins = 0;
      this.levelTime = 0;
      this.levelNoHit = true;
      Music.setLevel(n - 1);
      Level.load(Endless.build(n, this.endlessSeed));
      this.resetParty();
      Particles.clear();
      Camera.reset();
      this.shake = 0;
      this.levelItem = null;
      this.applyItemState();
      BgTiles.build(THEMES[this.themeIndex]);
      this.state = 'itemSelect';
      this.itemSel = 0;
    },

    // 选择本关临时道具（null 表示不选）
    chooseItem(id) {
      this.levelItem = id || null;
      this.applyItemState();
      this.state = 'levelIntro';
      this.introTimer = 110;
      Sound.click();
    },

    // 当前生命上限（联机固定 5；单人受「生命强化」加成）
    heartCap() {
      return this.multiplayer ? HEART_CAP : Storage.heartCap();
    },

    // 房主把视听反馈事件塞进下一份快照，供客人端播放
    netEvent(kind, x, y, extra) {
      if (!this.multiplayer || Net.role !== 'host' || !Net.inGame) return;
      const ev = { k: kind, x: Math.round(x), y: Math.round(y) };
      if (extra) Object.assign(ev, extra);
      if (Net.events.length < 48) Net.events.push(ev);
    },

    // 应用临时道具与永久能力效果（换关 / 重生时刷新）
    applyItemState() {
      this.slowFactor = this.levelItem === 'slow' ? 0.65 : 1;
      const shields = (this.levelItem === 'shield' ? 1 : 0) +
                      (Storage.upgrade('shield') > 0 ? 1 : 0);
      for (const p of players) p.shield = shields;
      this.shield = players[0].shield;   // 单人模式兼容
    },

    // 设置房间人数（1~4），多人核心与网络层共用
    setPartySize(n) {
      n = Math.max(1, Math.min(4, n | 0));
      while (players.length < n) {
        const p = createPartyPlayer(players.length, makeInputState());
        players.push(p);
        if (Level.data) p.reset(partySpawn(p.id, Level.spawnPoint()));
      }
      while (players.length > 1 && players.length > n) players.pop();
      this.lives = players[0].hearts;
    },

    // 重置整个队伍到出生点 / 检查点（每人独立生命）
    resetParty() {
      const base = Level.spawnPoint();
      const start = this.multiplayer ? DIFFICULTY.normal.lives : Storage.startLives();
      this.reviveUsed = false;
      for (const p of players) {
        p.reset(partySpawn(p.id, base));
        p.hearts = start;
        p.visualId = p.id;
        p.invuln = Storage.invulnFrames();
      }
      this.lives = players[0].hearts;
      this.maxLives = start;
      this.applyItemState();
    },

    // 当前磁铁吸附半径（永久能力受设置开关控制；临时道具始终生效；0 表示无）
    magnetRadius() {
      const up = Storage.data.magnetOn ? (MAGNET_RADIUS[Storage.upgrade('magnet')] || 0) : 0;
      const item = this.levelItem === 'magnet' ? ITEM_MAGNET_RADIUS : 0;
      return Math.max(up, item);
    },

    // 无尽结算：本局金币转入可支配金币，并记录最远房间 / 每日最佳
    finishEndless() {
      if (!this.endless || this.endlessFinished) return;
      this.endlessFinished = true;
      Storage.earnBank(this.totalCoins);
      if (this.daily) {
        const d = Storage.data.daily;
        if (d) {
          const key = dailyKey();
          if (d.date !== key) {
            d.date = key;
            d.bestRoom = 0;
            d.bestCoins = 0;
          }
          d.bestRoom = Math.max(d.bestRoom | 0, this.endlessRoom);
          d.bestCoins = Math.max(d.bestCoins | 0, this.totalCoins);
        }
      } else {
        Storage.data.endlessBest = Math.max(Storage.data.endlessBest, this.endlessRoom);
      }
      Storage.save();
      this.updateBest();
    },

    // 加载指定关卡并进入道具选择
    loadLevel(idx) {
      this.level = idx;
      this.themeIndex = (LEVELS[idx] && LEVELS[idx].themeIndex !== undefined)
        ? LEVELS[idx].themeIndex
        : idx % THEMES.length;
      this.coins = 0;
      this.levelTime = 0;
      this.levelNoHit = true;
      this.levelItem = null;
      Music.setLevel(idx);                 // 按关卡段切换主题 BGM
      Level.load(idx);
      this.resetParty();
      Particles.clear();
      Camera.reset();
      this.shake = 0;
      // 联机模式跳过道具选择，直接进入关卡过渡（道具由房主统一置空）
      this.state = this.multiplayer ? 'levelIntro' : 'itemSelect';
      if (this.multiplayer) this.introTimer = 120;
      this.itemSel = 0;
      BgTiles.build(THEMES[this.themeIndex]);   // 每关独立配色
    },

    // 重玩当前关（死亡后）；保留已选道具
    retryLevel() {
      // 无尽 / 每日挑战在生命耗尽后已结算，再重试视为开启新一局
      if (this.endless && this.endlessFinished) {
        if (this.daily) this.startDaily();
        else this.startEndless();
        return;
      }
      this.lives = Storage.startLives();
      this.maxLives = Storage.startLives();
      const item = this.levelItem;
      if (this.endless) this.loadEndlessRoom(this.endlessRoom);
      else this.loadLevel(this.level);
      this.levelItem = item;
      this.applyItemState();
      this.state = 'levelIntro';
      this.introTimer = 120;
      // Boss 战重试：保留 50% 已损失血量，并从 Boss 房入口重生
      if (this.bossCarry > 0 && Level.boss) {
        Level.boss.hp = Math.max(1, Level.boss.maxHp - this.bossCarry);
        if (Level.boss.hp <= Math.floor(Level.boss.maxHp / 2)) {
          Level.boss.phase = 2;
          Level.boss.summonCd = 90;
        }
        Level.bossFightStarted = true;
        for (const p of players) p.reset(partySpawn(p.id, Level.spawnPoint()));
      }
      this.bossCarry = 0;
    },

    // 暂停 / 继续
    pauseGame() {
      this.state = 'paused';
      this.pauseSelected = 0;
      Music.stop();
      Sound.pause();
    },
    resumeGame() {
      this.state = 'playing';
      Sound.pause();
    },

    // 返回主菜单（自动存档；无尽 / 每日挑战先结算）
    goMenu() {
      // 联机中返回：先结束联机对局，再回到大厅
      if (this.multiplayer) { Net.endToLobby(); return; }
      if (this.endless) this.finishEndless();
      this.endless = false;
      this.daily = false;
      this.levelItem = null;
      this.state = 'menu';
      this.menuSelected = 0;
      this.confetti = [];
      Music.stop();
      this.updateBest();
      Storage.save();
    },

    // 队伍传送：所有玩家回到最近检查点（不扣心，用于胆小鬼 / 队友受伤）
    teleportParty() {
      const base = Level.spawnPoint();
      this.coins = Level.snapshot ? Level.snapshot.coins : 0;
      // Boss 战普通受伤：回检查点但保留 Boss 当前血量与阶段，避免一次失误抹掉整场进度
      const bossKeep = (Level.boss && Level.boss.alive && Level.bossFightStarted)
        ? {
            hp: Level.boss.hp, maxHp: Level.boss.maxHp,
            phase: Level.boss.phase, summonCd: Level.boss.summonCd
          }
        : null;
      for (const p of players) {
        p.reset(partySpawn(p.id, base));
        p.invuln = Storage.invulnFrames();
        p.flash = 14;
      }
      this.applyItemState();
      Level.restoreSnapshot();             // 敌人 / 金币状态回滚到检查点
      Level.resetBoss();
      if (bossKeep && Level.boss) {
        Level.boss.hp = bossKeep.hp;
        Level.boss.maxHp = bossKeep.maxHp;
        Level.boss.phase = bossKeep.phase;
        Level.boss.summonCd = bossKeep.summonCd;
      }
      this.bossCarry = 0;
      Level.resetFallPlats();
      Level.resetTraps();
      Level.resetLava();
      this.lives = players[0].hearts;
    },

    // 损失生命（actor 为受伤玩家）：只有该玩家扣心，全队回检查点
    loseLife(actor, knockbackDir, cause) {
      // 兼容旧签名 loseLife(方向, 原因)
      if (typeof actor !== 'object') {
        cause = knockbackDir; knockbackDir = actor; actor = player;
      }
      const victim = actor || player;
      // 胆小鬼模式：坠落 / 熔岩等直接伤害也不扣心，仅回到检查点（联机规则优先）
      if (COWARD.NO_DAMAGE && Storage.coward() && !this.multiplayer) {
        this.teleportParty();
        this.shake = 3;
        Level.addPopup(victim.x + victim.w / 2, victim.y - 10,
                       '胆小鬼：生命不减', '#7ff0a8');
        return;
      }
      this.levelNoHit = false;
      // 记录受伤位置（重生后短暂显示虚影）
      this.deathMark = {
        x: victim.x, y: victim.y,
        level: this.level, timer: FEEL.DEATH_MARK_FRAMES
      };
      if (Level.boss && Level.bossFightStarted && Level.boss.alive) {
        this.bossCarry = Math.floor((Level.boss.maxHp - Level.boss.hp) * FEEL.BOSS_KEEP_DAMAGE);
      }

      victim.hearts = Math.max(0, victim.hearts - 1);
      this.lives = players[0].hearts;      // 单人 HUD 兼容
      this.shake = 9;
      Level.addPopup(victim.x + victim.w / 2, victim.y - 18,
                     'P' + (victim.id + 1) + ' -1 心', '#ff8a8a');
      this.netEvent('hurt', victim.x + victim.w / 2, victim.y + victim.h / 2,
                    { id: victim.id });

      // 不屈意志：每关第一次致命伤害改为保留 1 颗心
      if (victim.hearts <= 0 && Storage.upgrade('revive') > 0 && !this.reviveUsed) {
        this.reviveUsed = true;
        victim.hearts = 1;
        this.lives = players[0].hearts;
        this.shake = 12;
        Sound.heart();
        Level.addPopup(victim.x + victim.w / 2, victim.y - 30,
                       '不屈意志：保留 1 心', '#ffd23f');
        this.netEvent('revive', victim.x + victim.w / 2, victim.y + victim.h / 2,
                      { id: victim.id });
        this.teleportParty();
        return;
      }

      // 任意一人心扣完：全队失败
      if (victim.hearts <= 0) {
        this.finishEndless();
        Sound.death();
        Music.stop();
        this.state = 'dying';
        this.dyingTimer = 30;
        this.deadFade = 0;
        for (const p of players) {
          p.flash = 14;
          p.vy = -7;
          p.dashTime = 0;
        }
        this.updateBest();
        return;
      }

      if (cause === 'spike') Sound.spike();
      else Sound.hurt();
      // 只有受伤者扣心，其余玩家只被传送
      this.teleportParty();
      this.shake = 9;
    },

    // 受到伤害（actor 为受伤玩家）：护盾优先、变大其次，最后扣心
    hitPlayer(actor, dir, cause) {
      // 兼容旧签名 hitPlayer(方向, 原因)
      if (typeof actor !== 'object') {
        cause = dir; dir = actor; actor = player;
      }
      const target = actor || player;
      if (COWARD.NO_DAMAGE && Storage.coward() && !this.multiplayer) {
        target.invuln = Math.max(target.invuln, 40);
        this.shake = Math.max(this.shake, 3);
        Sound.pause();
        Level.addPopup(target.x + target.w / 2, target.y - 8,
                       '胆小鬼：不扣心', '#7ff0a8');
        return;
      }
      if (target.shield > 0) {
        target.shield--;
        target.invuln = Storage.invulnFrames();
        target.flash = 14;
        this.shake = Math.max(this.shake, 7);
        Sound.shrink();
        Particles.gemBurst(target.x + target.w / 2, target.y + target.h / 2);
        Level.addPopup(target.x + target.w / 2, target.y - 8, '护盾抵消', '#8adcff');
        this.netEvent('shield', target.x + target.w / 2, target.y + target.h / 2,
                      { id: target.id });
        return;
      }
      this.levelNoHit = false;             // 本关无伤记录失效
      if (target.big) {
        target.shrink();
        target.invuln = Storage.invulnFrames();
        target.flash = 14;
        this.shake = Math.max(this.shake, 9);
        Sound.shrink();
        Particles.shrinkBurst(target.x + target.w / 2, target.y + target.h / 2);
        Level.addPopup(target.x + target.w / 2, target.y - 8, '变小了', '#ffd23f');
        this.netEvent('shrink', target.x + target.w / 2, target.y + target.h / 2,
                      { id: target.id });
        return;
      }
      this.loseLife(target, dir, cause);
    },

    // 主动回到上一个检查点（暂停菜单选项，不损失生命）
    returnToCheckpoint() {
      if (!Level.snapshot && !Level.bossFightStarted) { Sound.pause(); return; }
      this.teleportParty();
      this.state = 'playing';
      Sound.pause();
    },

    // 单关通关：记录解锁、单关最高金币与最快通关时间
    completeLevel() {
      if (this.endless) { this.completeEndlessRoom(); return; }
      this.state = 'win';
      this.winFade = 0;
      Music.stop();
      Sound.win();
      this.runTime += this.levelTime;

      const best = Storage.data.levelBests[this.level];
      if (best) {
        best.cleared = true;
        if (this.coins > best.coins) best.coins = this.coins;
        if (best.time === 0 || this.levelTime < best.time) best.time = this.levelTime;
        // 奖章：通关 / 全金币 / 宝石 / 无伤
        const m = Object.assign({ clear: false, coins: false, gem: false, noHit: false },
                                best.medals || {});
        m.clear = true;
        if (this.coins >= Level.coinCfgs.length) m.coins = true;
        if (Storage.data.gems[this.level]) m.gem = true;
        if (this.levelNoHit) m.noHit = true;
        best.medals = m;
        Storage.data.medals = Storage.data.levelBests.map((b) => b.medals);
      }
      if (this.level + 1 < LEVEL_COUNT) {
        Storage.data.unlocked = Math.max(Storage.data.unlocked, this.level + 1);
      }
      // 本关金币转入可支配金币（能力商店消费）
      Storage.earnBank(this.coins);
      this.updateBest();
      Storage.save();
    },

    // 无尽房间通过：记录最远房间，金币在整局结束时统一入账
    completeEndlessRoom() {
      this.state = 'win';
      this.winFade = 0;
      Music.stop();
      Sound.win();
      this.runTime += this.levelTime;
      Storage.data.endlessBest = Math.max(Storage.data.endlessBest, this.endlessRoom);
      this.updateBest();
      Storage.save();
    },

    // 进入下一关 / 下一无尽房间 / 全游戏通关
    nextLevel() {
      if (this.endless) { this.loadEndlessRoom(this.endlessRoom + 1); return; }
      if (this.level + 1 >= LEVEL_COUNT) {
        this.state = 'gameComplete';
        this.winFade = 0;
        Storage.data.cleared = true;
        const last = Storage.data.levelBests[LEVEL_COUNT - 1];
        if (last) last.cleared = true;
        this.updateBest();
        Storage.save();
        Sound.complete();
      } else {
        this.loadLevel(this.level + 1);
      }
    },

    // 玩家与敌人交互：踩头消灭 / 侧碰受伤（actor 为当前玩家）
    handleEnemyCollision(e, actor) {
      if (!e.alive) return false;
      const p = actor || player;
      if (isStomping(p, e)) {
        // 尖刺怪头顶有刺：踩上去反而受伤
        if (e.type === 'spiky') {
          p.vy = -6;
          this.shake = Math.max(this.shake, 6);
          Sound.hurt();
          Level.addPopup(e.x + e.w / 2, e.y - 10, '尖刺!', '#ff8a8a');
          this.hitPlayer(p, p.x < e.x ? -1 : 1, 'hurt');
          return false;
        }
        // 铁甲 / 精英怪：非致命踩踏只削减一层血量
        if ((e.hp || 1) > 1) {
          e.hp--;
          e.hurtTimer = 24;
          p.vy = PHYS.STOMP_BOUNCE * 0.85;
          p.invuln = Math.max(p.invuln, 20);
          this.shake = Math.max(this.shake, 5);
          Particles.enemyChunks(e.x + e.w / 2, e.y + e.h / 2);
          Sound.stomp();
          Level.addPopup(e.x + e.w / 2, e.y - 10,
                         e.elite ? '精英受伤' : '护甲破损',
                         e.elite ? '#ffd23f' : '#c8d0dc');
          this.netEvent('armor', e.x + e.w / 2, e.y + e.h / 2);
          return false;
        }
        e.alive = false;
        e.deadTimer = 30;
        p.vy = PHYS.STOMP_BOUNCE;
        p.invuln = Math.max(p.invuln, 20);
        Particles.enemyChunks(e.x + e.w / 2, e.y + e.h / 2);
        Level.addRing(e.x + e.w / 2, e.y + e.h / 2);
        this.shake = Math.max(this.shake, 4);
        Sound.stomp();
        const reward = e.elite ? 3 : 1;
        Level.addPopup(e.x + e.w / 2, e.y, '+' + reward,
                       e.elite ? '#ffd23f' : '#ffe28a');
        if (e.elite) Particles.coinBurst(e.x + e.w / 2, e.y + e.h / 2);
        this.coins += reward; this.totalCoins += reward;
        this.netEvent('stomp', e.x + e.w / 2, e.y + e.h / 2);
        return true;
      }
      // 侧碰 / 底部碰：受伤并弹开
      const dir = p.x < e.x ? -1 : 1;
      p.vx = dir * 6;
      p.vy = -5;
      this.hitPlayer(p, dir, 'hurt');
      return false;
    },

    handleBossCollision(actor) {
      const b = Level.boss;
      if (!b || !b.alive) return;
      const p = actor || player;
      if (isStomping(p, b)) {
        b.hp--;
        b.hurtTimer = 60;
        p.vy = PHYS.STOMP_BOUNCE * 1.1;
        p.invuln = Math.max(p.invuln, 30);
        Sound.bossHit();
        Level.addPopup(b.x + b.w / 2, b.y, 'HIT!', '#ff6b6b');
        // 半血进入二阶段：提速 + 周期性召唤小怪
        if (b.hp > 0 && b.hp <= Math.floor(b.maxHp / 2) && b.phase === 1) {
          b.phase = 2;
          b.summonCd = 90;
          this.shake = 14;
          Particles.bossBurst(b.x + b.w / 2, b.y + b.h / 2);
          Level.addPopup(b.x + b.w / 2, b.y - 30, '狂暴!', '#ff5b6e');
          Sound.enrage();
        }
        if (b.hp <= 0) {
          b.alive = false;
          Level.spawnFlagAfterBoss();
          Particles.bossBurst(b.x + b.w / 2, b.y + b.h / 2);
          Sound.bossDown();
          this.coins += 10; this.totalCoins += 10;
          Level.addPopup(b.x + b.w / 2, b.y, '+10', '#ffd23f');
        }
      } else {
        const dir = p.x < b.x ? -1 : 1;
        p.vx = dir * 8;
        p.vy = -6;
        this.hitPlayer(p, dir, 'hurt');
      }
    },

    // ---- 菜单/设置动作 ----
    activateMenu(id) {
      Sound.click();
      if (id === 'start') this.startNewGame();
      else if (id === 'endless') this.startEndless();
      else if (id === 'daily') this.startDaily();
      else if (id === 'multiplayer') { this.state = 'multiplayer'; Net.openLobby(); }
      else if (id === 'select') { this.state = 'levelSelect'; this.levelSel = 0; this.levelAct = 0; }
      else if (id === 'shop') { this.state = 'shop'; this.shopSelected = 0; this.shopMsg = ''; }
      else if (id === 'gallery') { this.state = 'gallery'; this.galleryTab = 0; }
      else if (id === 'help') this.state = 'help';
      else if (id === 'settings') { this.state = 'settings'; this.settingsSelected = 0; }
    },

    // 购买 / 升级永久能力（扣除可支配金币）
    buyUpgrade(id) {
      const u = UPGRADES.find((x) => x.id === id);
      if (!u) return;
      const lv = Storage.upgrade(u.id);
      if (lv >= u.max) {
        Sound.pause();
        this.shopMsg = u.name + ' 已满级';
        return;
      }
      const price = Storage.upgradePrice(u);
      if (Storage.data.bankCoins < price) {
        Sound.pause();
        this.shopMsg = '金币不足：需要 ' + price;
        return;
      }
      Storage.data.bankCoins -= price;
      Storage.data.upgrades[u.id] = lv + 1;
      Storage.save();
      Sound.gem();
      this.shopMsg = u.name + ' 升级到 Lv' + (lv + 1);
    },

    // 音量增减：dir = -1 减小 / +1 增大，步进 10%
    // 设置页会持续播放 BGM，改音乐音量可立即听出差别
    adjustVolume(id, dir) {
      const key = id === 'sfxVol' ? 'sfxVol' : 'musicVol';
      const cur = Math.round(Storage.data[key] * 10) / 10;
      const next = Math.max(0, Math.min(1,
        Math.round((cur + dir * 0.1) * 10) / 10));
      Storage.data[key] = next;
      Sound.setVolumes();
      Storage.save();
      if (key === 'sfxVol') Sound.click();   // 用新音量给出即时反馈
    },

    toggleSetting(id) {
      // 音效开关：先切换再播放点击音，开启时能立即听到反馈
      if (id === 'sfx') {
        Storage.data.sfxOn = !Storage.data.sfxOn;
        Storage.save();
        Sound.click();
        return;
      }
      Sound.click();
      if (id === 'music') {
        Storage.data.musicOn = !Storage.data.musicOn;
        Storage.save();
        if (Storage.data.musicOn) {
          if (this.state === 'playing' || this.state === 'settings') Music.start();
        } else Music.stop();
      } else if (id === 'musicVol') {
        this.adjustVolume('musicVol', 1);
      } else if (id === 'sfxVol') {
        this.adjustVolume('sfxVol', 1);
      } else if (id === 'keyJump' || id === 'keyDash') {
        this.capturingKey = id === 'keyJump' ? 'jump' : 'dash';
      } else if (id === 'full') {
        toggleFullscreen();
      } else if (id === 'quality') {
        Storage.data.lowQuality = !Storage.data.lowQuality;
        Particles.clear();
        Storage.save();
      } else if (id === 'difficulty') {
        const cur = DIFFICULTY_ORDER.indexOf(Storage.data.difficulty);
        Storage.data.difficulty = DIFFICULTY_ORDER[(cur + 1) % DIFFICULTY_ORDER.length];
        Storage.save();
      } else if (id === 'coward') {
        Storage.data.coward = !Storage.data.coward;
        this.maxLives = Storage.startLives();
        Storage.save();
      } else if (id === 'magnet') {
        Storage.data.magnetOn = !Storage.data.magnetOn;
        Storage.save();
      } else if (id === 'skin') {
        // 只在已解锁的配色之间循环（宝石越多可选越多）
        const list = Storage.availableSkins();
        if (list.length <= 1) { Sound.pause(); return; }
        const cur = list.indexOf(Storage.data.skin);
        Storage.data.skin = list[(cur + 1) % list.length];
        Storage.save();
      } else if (id === 'back') {
        this.state = 'menu';
      }
    },

    pausedAction(id) {
      if (id === 'resume') this.resumeGame();
      else if (id === 'checkpoint') { this.returnToCheckpoint(); }
      else if (id === 'restart') { Sound.click(); this.retryLevel(); }
      else { this.goMenu(); }
    },

    // 静音切换：音效与音乐一起开关
    toggleMute() {
      const anyOn = Storage.data.sfxOn || Storage.data.musicOn;
      Storage.data.sfxOn = !anyOn;
      Storage.data.musicOn = !anyOn;
      if (anyOn) Music.stop();
      Storage.save();
    },

    // ---- 主循环状态更新 ----
    update() {
      this.tick++;
      Input.pollGamepad();
      if (this.shake > 0) this.shake--;
      if (Input.consumeFullscreen()) toggleFullscreen();
      if (Input.consumeMute()) this.toggleMute();

      // 背景音乐：游戏进行中播放；设置页也持续播放，便于实时试听音量
      if (this.state === 'playing' || this.state === 'settings') Music.start();
      else if (this.state !== 'paused') Music.stop();

      if (this.state === 'menu') {
        const btns = UI.menuButtons();
        const tap = Input.consumeTap();
        if (tap) {
          const hit = btns.find((b) => hitRect(tap.x, tap.y, b));
          if (hit) { this.menuSelected = btns.indexOf(hit); this.activateMenu(hit.id); }
        } else {
          if (Input.up)   { Input.up = false;   this.menuSelected = Math.max(0, this.menuSelected - 1); Sound.click(); }
          if (Input.down) { Input.down = false; this.menuSelected = Math.min(btns.length - 1, this.menuSelected + 1); Sound.click(); }
          if (Input.consumeConfirm()) this.activateMenu(btns[this.menuSelected].id);
        }
      } else if (this.state === 'multiplayer') {
        // 联机大厅：交互全部交给 DOM 覆盖层，画布只负责背景
        if (Input.consumeTap()) { /* 吞掉画布点击 */ }
      } else if (this.state === 'help') {
        if (Input.consumeTap() || Input.consumeConfirm() ||
            Input.consumeRestart() || Input.consumePause()) {
          this.state = 'menu';
          Sound.click();
        }
      } else if (this.state === 'gallery') {
        const tap = Input.consumeTap();
        if (tap) {
          // 点击页签切换，点击其它区域返回菜单
          const tab = UI.galleryTabs().find((t) => hitRect(tap.x, tap.y, t));
          if (tab) { this.galleryTab = tab.tab; Sound.click(); }
          else { this.state = 'menu'; Sound.click(); }
        } else {
          if (Input.left)  { Input.left = false;  this.galleryTab = 0; Sound.click(); }
          if (Input.right) { Input.right = false; this.galleryTab = 1; Sound.click(); }
          if (Input.consumeConfirm() || Input.consumeRestart() || Input.consumePause()) {
            this.state = 'menu';
            Sound.click();
          }
        }
      } else if (this.state === 'shop') {
        const rows = UI.shopRows();
        const tap = Input.consumeTap();
        if (tap) {
          const hit = rows.find((r) => hitRect(tap.x, tap.y, r));
          if (hit) {
            this.shopSelected = rows.indexOf(hit);
            if (hit.id === 'back') { this.state = 'menu'; Sound.click(); }
            else this.buyUpgrade(hit.id);
          }
        } else {
          if (Input.up)   { Input.up = false;   this.shopSelected = Math.max(0, this.shopSelected - 1); }
          if (Input.down) { Input.down = false; this.shopSelected = Math.min(rows.length - 1, this.shopSelected + 1); }
          if (Input.consumeConfirm()) {
            const cur = rows[this.shopSelected];
            if (cur.id === 'back') { this.state = 'menu'; Sound.click(); }
            else this.buyUpgrade(cur.id);
          }
          if (Input.consumePause()) { this.state = 'menu'; Sound.click(); }
        }
      } else if (this.state === 'settings') {
        const rows = UI.settingsRows();
        const tap = Input.consumeTap();
        if (tap) {
          const hit = rows.find((r) => hitRect(tap.x, tap.y, r));
          if (hit) {
            this.settingsSelected = rows.indexOf(hit);
            // 音量行：只有右侧「+」按钮增大，点击其它位置均减小
            if (hit.id === 'musicVol' || hit.id === 'sfxVol') {
              const z = UI.volumeZones(hit);
              this.adjustVolume(hit.id, tap.x >= z.plus.x ? 1 : -1);
            } else {
              this.toggleSetting(hit.id);
            }
          }
        } else {
          if (Input.up)   { Input.up = false;   this.settingsSelected = Math.max(0, this.settingsSelected - 1); }
          if (Input.down) { Input.down = false; this.settingsSelected = Math.min(rows.length - 1, this.settingsSelected + 1); }
          if (Input.left) {
            Input.left = false;
            const row = rows[this.settingsSelected];
            if (row.id === 'musicVol' || row.id === 'sfxVol') this.adjustVolume(row.id, -1);
          }
          if (Input.right) {
            Input.right = false;
            const row = rows[this.settingsSelected];
            if (row.id === 'musicVol' || row.id === 'sfxVol') this.adjustVolume(row.id, 1);
          }
          if (Input.consumeConfirm()) {
            const row = rows[this.settingsSelected];
            if (row.id === 'musicVol' || row.id === 'sfxVol') this.adjustVolume(row.id, 1);
            else this.toggleSetting(row.id);
          }
          if (Input.consumePause()) { this.state = 'menu'; Sound.click(); }
        }
      } else if (this.state === 'levelSelect') {
        const cards = UI.levelCards();
        const cols = UI.levelCols();
        const back = UI.levelBackButton();
        const tabs = UI.actTabs();
        const tap = Input.consumeTap();
        if (tap) {
          if (hitRect(tap.x, tap.y, back)) { this.state = 'menu'; Sound.click(); }
          else {
            const tabHit = tabs.find((t) => hitRect(tap.x, tap.y, t));
            if (tabHit) {
              this.levelAct = tabHit.act;
              this.levelSel = tabHit.act * 16;
              Sound.click();
            } else {
              const hit = cards.find((c) => hitRect(tap.x, tap.y, c));
              if (hit) {
                if (hit.index <= Storage.data.unlocked) { Sound.click(); this.startLevel(hit.index); }
                else Sound.pause();
              }
            }
          }
        } else {
          if (Input.left)  { Input.left = false;  this.levelSel = Math.max(0, this.levelSel - 1); Sound.click(); }
          if (Input.right) { Input.right = false; this.levelSel = Math.min(LEVEL_COUNT - 1, this.levelSel + 1); Sound.click(); }
          // 左右键跨过篇章边界时自动切换页签
          this.levelAct = this.levelSel < 16 ? 0 : 1;
          const actMin = this.levelAct * 16;
          const actMax = Math.min(LEVEL_COUNT - 1, actMin + 15);
          if (Input.up)    { Input.up = false;    this.levelSel = Math.max(actMin, this.levelSel - cols); Sound.click(); }
          if (Input.down)  { Input.down = false;  this.levelSel = Math.min(actMax, this.levelSel + cols); Sound.click(); }
          if (Input.consumeConfirm()) {
            if (this.levelSel <= Storage.data.unlocked) { Sound.click(); this.startLevel(this.levelSel); }
            else Sound.pause();
          }
          if (Input.consumePause()) { this.state = 'menu'; Sound.click(); }
        }
      } else if (this.state === 'itemSelect') {
        const cards = UI.itemCards();
        const skip = UI.itemSkip();
        const tap = Input.consumeTap();
        if (tap) {
          const hit = cards.find((c) => hitRect(tap.x, tap.y, c));
          if (hit) { this.itemSel = hit.index; this.chooseItem(ITEMS[hit.index].id); }
          else if (hitRect(tap.x, tap.y, skip)) this.chooseItem(null);
        } else {
          if (Input.left)  { Input.left = false;  this.itemSel = Math.max(0, this.itemSel - 1); Sound.click(); }
          if (Input.right) { Input.right = false; this.itemSel = Math.min(ITEMS.length - 1, this.itemSel + 1); Sound.click(); }
          if (Input.consumeConfirm()) this.chooseItem(ITEMS[this.itemSel].id);
          if (Input.consumePause() || Input.consumeRestart()) this.chooseItem(null);
        }
