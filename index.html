<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 本文件由 src/ 中的源码分块构建生成：请修改 src/ 后执行 node build.js -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>像素跳跃 · Pixel Runner</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #070a12;
    overflow: hidden;
    /* 移动端：禁止双击缩放、滑动回弹与长按选择，保证操作流畅 */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  canvas {
    touch-action: none;
    display: block;
    width: min(960px, 96vw, 170.6vh);
    height: auto;
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 2px #1d2a44, 0 24px 70px rgba(0, 0, 0, 0.65);
    border-radius: 4px;
    background: #0b1220;
  }

  /* ---- 多人联机大厅（DOM 覆盖层，仅联机时显示） ---- */
  #mpLobby {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(4, 7, 14, 0.9);
    color: #d7e3f7;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    touch-action: auto;
  }
  #mpLobby input {
    -webkit-user-select: text;
    user-select: text;
  }
  #mpLobby.open { display: flex; }
  #mpPanel {
    width: min(520px, 94vw);
    max-height: 92vh;
    overflow: auto;
    box-sizing: border-box;
    padding: 22px 24px 18px;
    border: 2px solid #2a4a7a;
    border-radius: 8px;
    background: linear-gradient(180deg, #142038, #0d1526);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .mp-title { font-size: 26px; font-weight: 700; color: #ffffff; letter-spacing: 2px; }
  .mp-sub { font-size: 12px; color: #7fd6ff; margin: 4px 0 14px; }
  .mp-status { font-size: 13px; color: #9fb3d1; margin-bottom: 14px; min-height: 18px; }
  .mp-status.err { color: #ff8a8a; }
  .mp-label { display: block; font-size: 13px; color: #9fb3d1; margin: 10px 0 6px; }
  .mp-input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    color: #ffffff;
    background: #0b1220;
    border: 2px solid #3a5a8a;
    border-radius: 4px;
    outline: none;
  }
  .mp-input:focus { border-color: #8adcff; }
  .mp-code { letter-spacing: 6px; text-align: center; font-weight: 700; }
  .mp-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .mp-btn {
    padding: 10px 18px;
    font-size: 14px;
    font-family: inherit;
    color: #d7e3f7;
    background: #16223c;
    border: 2px solid #3a5a8a;
    border-radius: 4px;
    cursor: pointer;
  }
  .mp-btn:hover { border-color: #8adcff; color: #ffffff; }
  .mp-btn:disabled { opacity: 0.45; cursor: default; border-color: #3a5a8a; }
  .mp-primary { background: #1d3f68; border-color: #8adcff; color: #ffffff; }
  .mp-danger { border-color: #8a3a4a; color: #ffb0b0; }
  .mp-mini { padding: 4px 10px; font-size: 12px; }
  .mp-codebar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #9fb3d1;
    margin-bottom: 12px;
  }
  .mp-codebar span { font-size: 22px; font-weight: 700; letter-spacing: 6px; color: #ffd23f; }
  .mp-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .mp-member {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    font-size: 14px;
    background: #101a2e;
    border: 1px solid #2a4a7a;
    border-radius: 4px;
  }
  .mp-member .tag { font-size: 12px; color: #9fb3d1; }
  .mp-member.ready .tag { color: #7ff0a8; }
  .mp-member .name { color: #ffffff; }
  .mp-kick {
    margin-left: 10px; padding: 4px 8px; font-size: 11px;
    background: #2a1620; color: #ff8a8a; border: 1px solid #6a2a3a;
    border-radius: 3px; cursor: pointer;
  }
  .mp-kick:hover { background: #4a1a28; }
  .mp-actions { margin-top: 6px; flex-wrap: wrap; }
  .mp-hint { margin-top: 14px; font-size: 12px; line-height: 1.7; color: #7f93b3; }
  .mp-close { margin-top: 14px; width: 100%; }
  .mp-room[hidden], .mp-setup[hidden] { display: none; }
</style>

<body>
<canvas id="game" width="960" height="540" aria-label="像素跳跃横版平台游戏"></canvas>

<!-- 多人联机大厅（由 Net 模块控制显示） -->
<div id="mpLobby">
  <div id="mpPanel">
    <div class="mp-title">多人联机</div>
    <div class="mp-sub">房主电脑作为服务器 · 局域网 / 外网隧道均可加入</div>
    <div id="mpStatus" class="mp-status">正在连接服务器…</div>

    <div id="mpSetup" class="mp-setup">
      <label class="mp-label" for="mpName">昵称</label>
      <input id="mpName" class="mp-input" maxlength="8" placeholder="玩家昵称">
      <div class="mp-row">
        <button id="mpCreate" class="mp-btn mp-primary">创建房间</button>
      </div>
      <div class="mp-row">
        <input id="mpCode" class="mp-input mp-code" maxlength="4" inputmode="numeric" placeholder="房间码">
        <button id="mpJoin" class="mp-btn">加入房间</button>
      </div>
    </div>

    <div id="mpRoom" class="mp-room" hidden>
      <div class="mp-codebar">房间码 <span id="mpCodeShow">----</span>
        <button id="mpCopy" class="mp-btn mp-mini">复制</button></div>
      <div id="mpList" class="mp-list"></div>
      <div class="mp-row mp-actions">
        <button id="mpReady" class="mp-btn">准备</button>
        <button id="mpStart" class="mp-btn mp-primary" hidden>开始游戏</button>
        <button id="mpLeave" class="mp-btn mp-danger">离开房间</button>
      </div>
    </div>

    <div id="mpHint" class="mp-hint"></div>
    <button id="mpClose" class="mp-btn mp-close">关闭</button>
  </div>
</div>

  // 地面（记录索引供敌人 / 检查点使用）
  function a2Ground(S, x, w, y) {
    const py = y === undefined ? GROUND_Y : y;
    S.plats.push(ground(x, w, py));
    S.grounds.push({ index: S.plats.length - 1, x, w, y: py });
  }
  // 浮台 / 单向平台
  function a2Ledge(S, x, y, w, ow) {
    S.plats.push(ow ? oneWay(x, y, w) : ledge(x, y, w));
    return { x, y, w };
  }
  // 隐藏高台（用于放置宝石 / 爱心）
  function a2High(S, x, y, w) {
    const h = a2Ledge(S, x, y, w, false);
    S.highs.push(h);
    return h;
  }
  // 一排金币
  function a2Coins(S, x, y, n, step) {
    const gap = step === undefined ? 40 : step;
    for (let i = 0; i < n; i++) {
      S.coins.push(coin(Math.round(x + i * gap), y));
    }
  }
  function a2Trap(S, kind, x, extra) {
    S.traps.push(Object.assign({ kind, x: Math.round(x) }, extra || {}));
  }

      S.x = x + len;
    },

    // 深坑：中间一块落脚浮台
    pit(S, gap, len) {
      const x = S.x + gap;
      if (gap >= 150) {
        const mx = S.x + Math.round(gap * 0.45);
        a2Ledge(S, mx, 415, 72);
        a2Coins(S, mx + 16, 375, 2, 28);
      } else {
        a2Coins(S, S.x + 26, GROUND_Y - 96, Math.max(2, Math.round(gap / 60)), 36);
      }
      a2Ground(S, x, len);
      a2Coins(S, x + 40, GROUND_Y - 50, 3, 40);
      S.x = x + len;
    },

    // 台阶：先上后下，顶部可藏收集物
    stairs(S, gap, steps, len) {
      const x0 = S.x + gap;
      let last = x0;
      for (let k = 1; k <= steps; k++) {
        const lx = x0 + (k - 1) * A2.STEP_W;
        a2Ledge(S, lx, GROUND_Y - A2.STEP_H * k, 85);
        a2Coins(S, lx + 14, GROUND_Y - A2.STEP_H * k - 42, 2, 28);
        last = lx + 85;
      }
      for (let k = steps - 1; k >= 1; k--) {
        const lx = last + 10;
        a2Ledge(S, lx, GROUND_Y - A2.STEP_H * k, 85);
        a2Coins(S, lx + 14, GROUND_Y - A2.STEP_H * k - 42, 1, 0);
        last = lx + 85;
      }
      const gx = last + Math.max(70, Math.round(gap * 0.55));
      a2Ground(S, gx, len || 280);
      a2Coins(S, gx + 40, GROUND_Y - 50, 3, 40);
      S.x = gx + (len || 280);
    },

    // 移动平台跨坑
    mover(S, gap, axis, range, len) {
      const x = S.x + gap;
      const bx = axis === 'x' ? S.x + Math.round(gap * 0.18) : x - 100;
      S.plats.push(mover(bx, 415, 95, axis, range, 0.028, 0));
      a2Coins(S, bx + 18, 366, 2, 28);
      a2Ground(S, x, len);
      a2Coins(S, x + 40, GROUND_Y - 50, 3, 40);
      S.x = x + len;
    },

    // 下坠平台链
    fall(S, gap, len) {
      const x = S.x + gap;
      const f1 = S.x + Math.round(gap * 0.24);
      const f2 = S.x + Math.round(gap * 0.58);
      S.fallPlats.push({ x: f1, y: 420, w: 82 }, { x: f2, y: 392, w: 82 });
      a2Coins(S, f1 + 16, 380, 2, 28);
      a2Coins(S, f2 + 16, 352, 2, 28);
      a2Ground(S, x, len);
      a2Coins(S, x + 40, GROUND_Y - 50, 3, 40);
      S.x = x + len;
    },

    // 单向平台桥（下方是深渊）
    bridge(S, gap, count, len) {
      let bx = S.x + gap;
      for (let i = 0; i < count; i++) {
        const y = 428 - (i % 2) * 22;
        a2Ledge(S, bx, y, 84, true);
        a2Coins(S, bx + 16, y - 40, 2, 26);
        bx += 100;
      }
      const gx = bx + 20;
      a2Ground(S, gx, len);
      a2Coins(S, gx + 40, GROUND_Y - 50, 3, 40);
      S.x = gx + len;
    },

    // 弹跳板 + 隐藏高台
    pad(S, gap, len) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      const px = x + Math.round(len * 0.38);
      S.pads.push({ x: px, y: GROUND_Y, w: 52 });
      const hi = a2High(S, px - 34, GROUND_Y - 158, 112);
      a2Coins(S, hi.x + 18, hi.y - 38, 3, 28);
      if (!S.gem) S.gem = { x: hi.x + 50, y: hi.y - 72 };
      a2Coins(S, x + 30, GROUND_Y - 50,
        Math.min(4, Math.max(2, Math.round(len / 100))), 40);
      S.x = x + len;
    },

    // 纵向单向平台塔（隐藏路线）
    tower(S, gap, len, steps) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      let lx = x + 34;
      let top = null;
      for (let k = 1; k <= steps; k++) {
        top = a2Ledge(S, lx, GROUND_Y - 55 * k, 78, true);
        a2Coins(S, lx + 14, GROUND_Y - 55 * k - 38, 2, 26);
        lx += 80;
      }
      if (top) {
        S.highs.push(top);
        if (!S.gem) S.gem = { x: top.x + 38, y: top.y - 68 };
      }
      S.x = x + len;
    },

    // 尖刺段：上方单向平台可绕行
    spike(S, gap, len, count) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      for (let i = 0; i < (count || 1); i++) {
        const ratio = count > 1 ? 0.28 + 0.44 * i / (count - 1) : 0.42;
        S.spikes.push({
          x: Math.round(x + len * ratio), y: 458, w: 42, h: 12
        });
      }
      a2Ledge(S, x + 24, GROUND_Y - 132, Math.min(150, len - 60), true);
      a2Coins(S, x + 40, GROUND_Y - 172, 3, 30);
      a2Coins(S, x + 40, GROUND_Y - 50, 2, 40);
      S.x = x + len;
    },

    crusher(S, gap, len, count) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      for (let i = 0; i < (count || 1); i++) {
        const ratio = count > 1 ? 0.3 + 0.4 * i / (count - 1) : 0.4;
        a2Trap(S, 'crusher', x + len * ratio - TRAP.CRUSHER_W / 2,
          { phase: i * 30 });
      }
      a2Coins(S, x + 36, GROUND_Y - 50,
        Math.min(4, Math.max(2, Math.round(len / 100))), 40);
      S.x = x + len;
    },

    popspike(S, gap, len, count) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      for (let i = 0; i < (count || 1); i++) {
        const ratio = count > 1 ? 0.3 + 0.4 * i / (count - 1) : 0.4;
        a2Trap(S, 'popspike', x + len * ratio - TRAP.SPIKE_W / 2,
          { phase: i * 24 });
      }
      a2Coins(S, x + 36, GROUND_Y - 50, 3, 40);
      S.x = x + len;
    },

    saw(S, gap, len) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      a2Trap(S, 'saw', x + len * 0.55, { range: 80, speed: 0.034 });
      a2Coins(S, x + 36, GROUND_Y - 50, 3, 40);
      S.x = x + len;
    },

    laser(S, gap, len) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      a2Trap(S, 'laser', x + len * 0.3, { y: GROUND_Y - 76, w: 150 });
      a2Coins(S, x + Math.round(len * 0.3) + 40, GROUND_Y - 120, 3, 30);
      a2Coins(S, x + 36, GROUND_Y - 50, 2, 40);
      S.x = x + len;
    },

    pendulum(S, gap, len) {
      const x = S.x + gap;
      a2Ground(S, x, len);
      a2Trap(S, 'pendulum', x + len * 0.5);
      a2Coins(S, x + 36, GROUND_Y - 50, 2, 40);
      a2Coins(S, x + Math.round(len * 0.5) - 40, GROUND_Y - 150, 2, 30);
      S.x = x + len;
    },

    // Boss 房（Boss 参数取 def.boss）
    arena(S, gap) {
      const x = S.x + gap;
      a2Ground(S, x, 780);
      S.arena = { x: x + 60, y: GROUND_Y - PH };
      const cfg = S.bossDef || { hp: 8, speed: 1.6 };
      S.boss = {
        platform: S.plats.length - 1,
        x: x + 600,
        dir: -1,
        speed: cfg.speed,
        hp: cfg.hp,
        style: cfg.style || 'brute'
      };
      a2Coins(S, x + 40, GROUND_Y - 50, 2, 40);
      S.x = x + 780;
    },

    // 终点旗地面
    finish(S, gap) {
      const x = S.x + gap;
      a2Ground(S, x, 420);
      a2Coins(S, x + 40, GROUND_Y - 50, 3, 40);
      S.x = x + 420;
      S.flagX = S.x - 40;
    }
  };

  // 逐章节拼装一整关，并自动布置检查点 / 收集物 / 敌人
  function buildActTwoLevel(def, index) {
    const S = {
      plats: [], coins: [], spikes: [], traps: [],
      fallPlats: [], pads: [], grounds: [], highs: [],
      x: 0, gem: null, arena: null, boss: null, flagX: null,
      bossDef: def.boss || null
    };
    for (const tok of def.sections) {
      const fn = ACT_SECTIONS[tok[0]];
      if (fn) fn.apply(null, [S].concat(tok.slice(1)));
    }

    const width = Math.max(3000, S.x);

    // ---- 检查点：沿主线地面每 ~1200px 一根，Boss 房与终点前不放 ----
    const limitX = S.arena ? S.arena.x - 120 : width - 500;
    const checkpoints = [];
    let lastCp = -9999;
    for (const g of S.grounds) {
      if (g.x < 900 || g.x > limitX || g.w < 160) continue;
      const cx = g.x + Math.min(Math.round(g.w * 0.32), 180);
      if (cx - lastCp < 1150) continue;
      checkpoints.push({ x: cx, y: g.y });
      lastCp = cx;
      if (checkpoints.length >= 4) break;
    }

    // ---- 爱心：优先放在隐藏高台，不足时补在主线后半段 ----
    const hearts = [];
    for (const h of S.highs) {
      if (hearts.length >= 2) break;
      if (h.x < 1200) continue;
      if (hearts.some((o) => Math.abs(o.x - h.x) < 900)) continue;
      hearts.push({ x: Math.round(h.x + h.w / 2), y: Math.round(h.y - 46) });
    }
    if (hearts.length < 2) {
      for (const g of S.grounds) {
        if (hearts.length >= 2) break;
        if (g.x < 1100 || g.x > width - 600) continue;
        if (S.arena && g.x >= S.arena.x - 100) continue;
        if (hearts.some((o) => Math.abs(o.x - (g.x + g.w / 2)) < 900)) continue;
        hearts.push({ x: g.x + Math.round(g.w * 0.55), y: g.y - 76 });
      }
    }

    // ---- 隐藏宝石：弹跳板高台 / 塔顶 ----
    let gem = null;
    if (S.gem) {
      gem = { x: Math.round(S.gem.x), y: Math.round(S.gem.y) };
    } else if (S.highs.length) {
      const h = S.highs[S.highs.length - 1];
      gem = { x: Math.round(h.x + h.w / 2), y: Math.round(h.y - 66) };
    }

    // ---- 变大果实：中后段地面 ----
    let fruit = null;
    const fruitGrounds = S.grounds.filter((g) =>
      g.w >= 240 && g.x > width * 0.45 && g.x < width * 0.85 &&
      (!S.arena || g.x < S.arena.x - 100));
    if (fruitGrounds.length) {
      const g = fruitGrounds[Math.floor(fruitGrounds.length * 0.4)];
      fruit = { x: Math.round(g.x + g.w * 0.55), y: GROUND_Y - 44 };
    }

    // ---- 敌人：按章节地面均匀分布，种类循环，难度随 tier 提升 ----
    const enemies = [];
    const types = def.types;
    const cap = 8 + def.tier;
    const stopX = S.arena ? S.arena.x - 140 : width - 260;
    let count = 0;
    S.grounds.forEach((g, gi) => {
      if (count >= cap) return;
      if (g.x < 700 || g.x > stopX || g.w < 190) return;
      const per = (def.tier >= 5 ? 2 : 1) +
        (def.tier >= 7 && g.w >= 320 ? 1 : 0);
      for (let k = 0; k < per && count < cap; k++) {
        const span = Math.max(50, g.w - 170);
        enemies.push({
          platform: g.index,
          x: g.x + 70 + ((gi * 47 + k * 113) % span),
          dir: count % 2 === 0 ? 1 : -1,
          speed: Math.round((0.88 + def.tier * 0.05) * 100) / 100,
          type: types[count % types.length],
          elite: def.tier >= 5 && count % 4 === 1
        });
        count++;
      }
    });

    const flag = S.flagX === null ? null
      : { x: Math.round(S.flagX), y: 374, w: 5, h: 96 };
    const flagTrigger = S.flagX === null ? null
      : { x: Math.round(S.flagX) - 24, y: 356, w: 70, h: 114 };

    return {
      name: '第 ' + (index + 1) + ' 关 · ' + def.name,
      tip: def.tip,
      width,
      spawn: { x: 60, y: GROUND_Y - PH },
      platforms: S.plats,
      fallPlats: S.fallPlats,
      pads: S.pads,
      enemies,
      coins: S.coins,
      spikes: S.spikes,
      checkpoints,
      traps: S.traps,
      gems: gem ? [gem] : [],
      hearts,
      fruits: fruit ? [fruit] : [],
      gates: null,
      flag,
      flagTrigger,
      boss: S.boss,
      bossArena: S.arena,
      biome: { ...def.biome },
      enemyTypes: def.types.slice(),
      hints: def.hints.map((h) => ({ x: h.x, y: h.y, text: h.text, seen: false })),
      themeIndex: def.theme
    };
  }

  // 生成并追加第 17~32 关
  for (let i = 0; i < ACT_TWO_DEFS.length; i++) {
    LEVELS.push(buildActTwoLevel(ACT_TWO_DEFS[i], 16 + i));
  }

  // ============================================================
  // 3. 通用工具
  // ============================================================
  const canvas = document.getElementById('game');
  const mainCtx = canvas.getContext('2d');
  // ctx 可临时切换到离屏画布，用于精灵缓存
  let ctx = mainCtx;
  ctx.imageSmoothingEnabled = false;

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  // 普通/飞行/尖刺怪只有两帧步态与生死状态，预渲染后直接 drawImage
  const ENEMY_SPRITE_CACHE = Object.create(null);
  function enemySprite(type, step, alive, draw) {
    const key = type + '_' + step + '_' + (alive ? 1 : 0);
    let c = ENEMY_SPRITE_CACHE[key];
    if (!c) {
      c = document.createElement('canvas');
      c.width = 40;
      c.height = 40;
      const cc = c.getContext('2d');
      cc.imageSmoothingEnabled = false;
      const old = ctx;
      ctx = cc;
      try { draw(4, 10); } finally { ctx = old; }
      ENEMY_SPRITE_CACHE[key] = c;
    }
    return c;
  }

  // 轴对齐包围盒（AABB）相交检测
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // 玩家是否“从上方”落到目标上（用于踩头判定）
  // 用移动前的 prevY 判断上一帧脚底位置，避免 vy 被平台碰撞清零后误判；
  // 阈值取目标垂直中心，快速下落穿透时仍可识别为踩头。
  function isStomping(player, target) {
    const prevBottom = player.prevY + player.h;
    return player.vy >= 0 && prevBottom <= target.y + target.h * 0.5;
  }

  function drawText(str, x, y, size, color, align, bold) {
    ctx.font = (bold === false ? '' : 'bold ') + size +
      'px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", monospace';
    ctx.fillStyle = color;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, Math.round(x), Math.round(y));
  }

  // ============================================================
  // 3.5 本地存档 / 音频 / 粒子 / UI 布局（第三阶段新增）
  // ============================================================

  // ---- 本地存档（localStorage）----
  // 每日挑战：以本地日期作为种子，保证同一天所有玩家拿到相同布局
  function dailyKey() {
    const d = new Date();
    const pad = (n) => (n < 10 ? '0' + n : '' + n);
    return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }
  function dailySeed(key) {
    const s = key || dailyKey();
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function dailyBestRoom() {
    const d = Storage.data.daily;
    return (d && d.date === dailyKey()) ? (d.bestRoom | 0) : 0;
  }

  const Storage = {
    data: {
      sfxOn: true,      // 音效开关
      musicOn: true,    // 音乐开关
      cleared: false,   // 是否全游戏通关
      bestCoins: 0,     // 历史最高金币收集数
      unlocked: 0,      // 已解锁的最高关卡索引（0 起）
      levelBests: [],   // 每关记录：[{ cleared, coins, time }]
      gems: [],         // 每关宝石是否已收集
      skin: 0,          // 当前角色配色皮肤索引
      difficulty: 'normal', // 难度：casual / normal / hard
      lowQuality: false, // 低画质模式（关闭粒子与视差）
      musicVol: 0.22,   // 背景音乐音量 0~1
      sfxVol: 1,        // 音效音量 0~1
      coward: false,    // 胆小鬼模式（难度大减）
      magnetOn: true,   // 金币磁铁开关（关闭后已购买的磁铁永久能力失效，临时道具不受影响）
      keys: { jump: 'Space', dash: 'ShiftLeft' }, // 可自定义按键
      medals: [],       // 每关奖章（由 levelBests 内记录同步展示）
      bankCoins: 0,     // 可支配金币（通关奖励，能力商店消费）
      upgrades: { magnet: 0, shield: 0, dash: 0, jump: 0 }, // 永久能力等级
      endlessBest: 0,   // 无尽模式历史最远房间
      daily: { date: '', bestRoom: 0, bestCoins: 0 } // 每日挑战记录
    },
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) Object.assign(this.data, JSON.parse(raw));
      } catch (e) { /* 隐私模式 / 受限环境下静默降级 */ }

      // 兼容旧存档：统一补齐 32 关记录与宝石进度
      const list = [];
      for (let i = 0; i < LEVEL_COUNT; i++) {
        const src = (this.data.levelBests && this.data.levelBests[i]) || null;
        list.push({
          cleared: !!(src && src.cleared),
          coins: (src && src.coins) || 0,
          time: (src && src.time) || 0,
          medals: Object.assign({ clear: false, coins: false, gem: false, noHit: false },
                                (src && src.medals) || {})
        });
      }
      if (this.data.cleared) {
        for (let i = 0; i < LEVEL_COUNT; i++) list[i].cleared = true;
        this.data.unlocked = LEVEL_COUNT - 1;
      }
      this.data.levelBests = list;
      this.data.medals = list.map((b) => b.medals);

      const gems = [];
      for (let i = 0; i < LEVEL_COUNT; i++) {
        gems.push(!!(this.data.gems && this.data.gems[i]));
      }
      this.data.gems = gems;

      if (!DIFFICULTY[this.data.difficulty]) this.data.difficulty = 'normal';
      this.data.skin = Math.max(0, Math.min(SKINS.length - 1, this.data.skin | 0));
      if (!this.skinUnlocked(this.data.skin)) this.data.skin = 0;
      this.data.lowQuality = !!this.data.lowQuality;
      this.data.coward = !!this.data.coward;
      this.data.magnetOn = this.data.magnetOn === undefined ? true : !!this.data.magnetOn;
      this.data.musicVol = Math.max(0, Math.min(1,
        this.data.musicVol === undefined ? AUDIO.MUSIC_VOLUME : +this.data.musicVol));
      this.data.sfxVol = Math.max(0, Math.min(1,
        this.data.sfxVol === undefined ? 1 : +this.data.sfxVol));
      this.data.keys = Object.assign(
        { jump: 'Space', dash: 'ShiftLeft' },
        this.data.keys || {}
      );
      this.data.medals = list.map((b) => b.medals);

      // 能力商店 / 无尽模式存档兼容（旧存档自动补齐）
      this.data.bankCoins = Math.max(0, this.data.bankCoins | 0);
      const up = Object.assign({ magnet: 0, shield: 0, dash: 0, jump: 0 },
                               this.data.upgrades || {});
      for (const u of UPGRADES) {
        up[u.id] = Math.max(0, Math.min(u.max, up[u.id] | 0));
      }
      this.data.upgrades = up;
      this.data.endlessBest = Math.max(0, this.data.endlessBest | 0);
      // 每日挑战存档兼容
      if (!this.data.daily || typeof this.data.daily !== 'object') {
        this.data.daily = { date: '', bestRoom: 0, bestCoins: 0 };
      }
      this.data.daily.date = String(this.data.daily.date || '');
      this.data.daily.bestRoom = Math.max(0, this.data.daily.bestRoom | 0);
      this.data.daily.bestCoins = Math.max(0, this.data.daily.bestCoins | 0);
    },
    save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); } catch (e) {}
    },
    // 已收集宝石总数
    gemsCount() {
      return this.data.gems.filter(Boolean).length;
    },
    // 指定配色是否已解锁
    skinUnlocked(index) {
      const s = SKINS[index];
      return !!s && this.gemsCount() >= s.unlock;
    },
    // 已解锁的配色索引（按 SKINS 顺序）
    availableSkins() {
      const g = this.gemsCount();
      const list = [];
      for (let i = 0; i < SKINS.length; i++) {
        if (SKINS[i].unlock <= g) list.push(i);
      }
      return list;
    },
    // 当前难度配置
    diff() {
      return DIFFICULTY[this.data.difficulty] || DIFFICULTY.normal;
    },
    // 胆小鬼模式是否开启
    coward() {
      return !!this.data.coward;
    },
    // 出发 / 重试时的生命数（胆小鬼模式固定满 5 颗心；生命强化每级 +1）
    startLives() {
      const base = this.coward() ? COWARD.LIVES : this.diff().lives;
      return base + this.upgrade('vitality');
    },
    // 生命上限（基础 5 + 生命强化等级）
    heartCap() {
      return HEART_CAP + this.upgrade('vitality');
    },
    // 受伤后的无敌帧（胆小鬼模式加倍）
    invulnFrames() {
      return Math.round(PHYS.INVULN_FRAMES *
        (this.coward() ? COWARD.INVULN_MUL : 1));
    },
    // 敌人移速倍率（难度 × 胆小鬼模式）
    enemySpeedMul() {
      return this.diff().enemySpeed *
        (this.coward() ? COWARD.ENEMY_SPEED : 1);
    },
    // 已通关关卡数（用于进度百分比）
    clearedCount() {
      return this.data.levelBests.filter((b) => b && b.cleared).length;
    },
    // 奖章总数（每关 4 枚：通关 / 全金币 / 宝石 / 无伤）
    medalCount() {
      let n = 0;
      for (const b of this.data.levelBests) {
        const m = (b && b.medals) || {};
        for (const k of ['clear', 'coins', 'gem', 'noHit']) if (m[k]) n++;
      }
      return n;
    },
    // 永久能力等级
    upgrade(id) {
      return (this.data.upgrades && this.data.upgrades[id]) || 0;
    },
    // 下一级价格（已满级返回 0）
    upgradePrice(u) {
      const lv = this.upgrade(u.id);
      return lv >= u.max ? 0 : u.prices[lv];
    },
    // 获得可支配金币（通关 / 无尽结算）
    earnBank(n) {
      if (!n || n <= 0) return;
      this.data.bankCoins += n;
      this.save();
    }
  };

  // 关卡短名（去掉“第 N 关 · ”前缀，供紧凑卡片 / 图鉴使用）
  function levelShortName(index) {
    const full = LEVELS[index] ? LEVELS[index].name : '';
    const parts = full.split(' · ');
    return parts.length > 1 ? parts.slice(1).join(' · ') : full;
  }

  // 帧数 → mm:ss（用于结算与记录展示）
  function formatTime(frames) {
    if (!frames || frames <= 0) return '—';
    const total = Math.floor(frames / 60);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  // 按键代码 → 便于阅读的名称
  function keyLabel(code) {
    if (!code) return '—';
    if (code === 'Space') return '空格';
    if (code === 'ShiftLeft') return '左Shift';
    if (code === 'ShiftRight') return '右Shift';
    if (code.startsWith('Key')) return code.slice(3);
    if (code.startsWith('Arrow')) return code.slice(5);
    if (code.startsWith('Digit')) return code.slice(5);
    return code;
  }

  // ---- 8bit 音效（Web Audio API 纯代码生成，无外部音频文件）----
  const Sound = {
    ctx: null, master: null, sfxBus: null, musicBus: null, ready: false,

    // 音量变更后同步到音频总线（设置页实时生效）
    setVolumes() {
      if (!this.ready) return;
      this.sfxBus.gain.value = Storage.data.sfxVol;
      this.musicBus.gain.value = Storage.data.musicVol;
    },

    // 首次用户手势时初始化（浏览器自动播放策略要求）
    unlock() {
      if (this.ready) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = AUDIO.MASTER_VOLUME;
      this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain();
      this.sfxBus.gain.value = Storage.data.sfxVol;
      this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain();
      this.musicBus.gain.value = Storage.data.musicVol;
      this.musicBus.connect(this.master);
      this.ready = true;
    },

    // 单个方波音：可带频率滑音（freqEnd）
    tone(freq, dur, vol, freqEnd, type) {
      if (!this.ready || !Storage.data.sfxOn) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t);
      if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.sfxBus);
      o.start(t); o.stop(t + dur + 0.02);
    },

    // 琶音（连续音符）
    arp(freqs, step, vol, type) {
      if (!this.ready || !Storage.data.sfxOn) return;
      const base = this.ctx.currentTime;
      freqs.forEach((f, i) => {
        const t = base + i * step;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + step * 0.95 + 0.02);
        o.connect(g); g.connect(this.sfxBus);
        o.start(t); o.stop(t + step + 0.02);
      });
    },

    // 各类音效事件
    jump()       { this.tone(440, 0.09, 0.16, 660); },
    doubleJump() { this.tone(620, 0.10, 0.16, 940); },
    dash()       { this.tone(880, 0.12, 0.14, 320, 'sawtooth'); },
    land()       { this.tone(180, 0.06, 0.10, 110); },
    coin()       { this.arp([988, 1319], 0.045, 0.16); },
    stomp()      { this.tone(500, 0.10, 0.16, 180); },
    hurt()       { this.tone(320, 0.16, 0.18, 120); },
    death()      { this.arp([392, 330, 262, 196], 0.11, 0.18); },
    spike()      { this.tone(240, 0.08, 0.16, 80); },
    win()        { this.arp([523, 659, 784, 1046], 0.09, 0.18); },
    bossHit()    { this.tone(180, 0.12, 0.20, 90); },
    bossDown()   { this.arp([262, 220, 175, 131, 98], 0.10, 0.20); },
    complete()   { this.arp([523, 659, 784, 1046, 1319, 1046, 1319], 0.12, 0.20); },
    click()      { this.tone(660, 0.04, 0.10); },
    pause()      { this.tone(420, 0.05, 0.10); },
    // 第四阶段新增
    checkpoint() { this.arp([659, 880, 1319], 0.06, 0.18); },   // 检查点激活
    bounce()     { this.tone(300, 0.14, 0.16, 780); },          // 弹跳板弹起
    drop()       { this.tone(220, 0.06, 0.10, 140); },          // 单向平台下穿
    enrage()     { this.arp([196, 165, 131, 98], 0.10, 0.20, 'sawtooth'); }, // Boss 狂暴
    gem()        { this.arp([784, 1046, 1319, 1568], 0.07, 0.20); },     // 宝石收集
    heart()      { this.arp([523, 784, 1046], 0.07, 0.16); },            // 爱心拾取
    power()      { this.arp([392, 523, 659, 784], 0.06, 0.18); },        // 变大果实
    shrink()     { this.tone(392, 0.16, 0.16, 180, 'sawtooth'); },       // 受伤变小
    laser()      { this.tone(880, 0.10, 0.10, 1320, 'sawtooth'); },       // 激光发射
    gate()       { this.arp([330, 262, 196], 0.09, 0.16); }              // 机关门开启
  };

  // ---- 8bit 循环背景音乐（轻快旋律 + 低音）----
  const Music = {
    timer: null, step: 0, nextTime: 0, playing: false,
    // 三套主题 BGM：1-11 关轻快 / 12-22 关低沉 / 23-32 关空灵
    TRACKS: [
      {
        melody: [
          523.25, 659.25, 783.99, 659.25, 440.00, 523.25, 659.25, 523.25,
          698.33, 880.00, 1046.50, 880.00, 783.99, 659.25, 523.25, 392.00
        ],
        bass: [130.81, 174.61, 196.00, 130.81]
      },
      {
        melody: [
          392.00, 440.00, 523.25, 440.00, 349.23, 392.00, 523.25, 392.00,
          329.63, 415.20, 466.16, 415.20, 349.23, 293.66, 261.63, 196.00
        ],
        bass: [110.00, 130.81, 98.00, 87.31]
      },
      {
        melody: [
          659.25, 783.99, 880.00, 1046.50, 783.99, 659.25, 523.25, 440.00,
          698.33, 880.00, 1174.66, 880.00, 783.99, 659.25, 523.25, 392.00
        ],
        bass: [146.83, 174.61, 196.00, 130.81]
      }
    ],
    track: 0,

    setLevel(index) {
      this.track = index < 11 ? 0 : (index < 22 ? 1 : 2);
      this.step = 0;
    },

    start() {
      if (!Sound.ready || !Storage.data.musicOn || this.playing) return;
      this.playing = true;
      this.step = 0;
      this.nextTime = Sound.ctx.currentTime + 0.05;
      // 每 100ms 预排 0.25s 的音符，主线程开销极低
      this.timer = setInterval(() => this.schedule(), 100);
      this.schedule();
    },
    stop() {
      this.playing = false;
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
    },
    schedule() {
      if (!this.playing) return;
      const ctx = Sound.ctx;
      while (this.nextTime < ctx.currentTime + 0.25) {
        this.playStep(this.step, this.nextTime);
        const tr = this.TRACKS[this.track];
        this.step = (this.step + 1) % tr.melody.length;
        this.nextTime += AUDIO.BEAT;
      }
    },
    playStep(i, t) {
      const ctx = Sound.ctx;
      const tr = this.TRACKS[this.track];
      const f = tr.melody[i];
      if (f > 0) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.5, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + AUDIO.BEAT * 0.9);
        o.connect(g); g.connect(Sound.musicBus);
        o.start(t); o.stop(t + AUDIO.BEAT);
      }
      if (i % 4 === 0) {
        const bf = tr.bass[(i / 4) % tr.bass.length];
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(bf, t);
        g.gain.setValueAtTime(0.35, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + AUDIO.BEAT * 1.8);
        o.connect(g); g.connect(Sound.musicBus);
        o.start(t); o.stop(t + AUDIO.BEAT * 2);
      }
    }
  };

  // ---- 粒子系统 ----
  const Particles = {
    list: [],
    spawn(x, y, count, opt) {
      if (Storage.data.lowQuality) return;    // 低画质模式：关闭粒子特效
      for (let i = 0; i < count; i++) {
        if (this.list.length >= PARTICLES.CAP) break;
        const ang = (opt && opt.angle !== undefined)
          ? opt.angle + (Math.random() - 0.5) * (opt.spread || 0)
          : Math.random() * Math.PI * 2;
        const spd = ((opt && opt.speed) || 3) * (0.5 + Math.random());
        const life = (opt && opt.life) || 26;
        this.list.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - ((opt && opt.up) || 0),
          life, maxLife: life,
          size: (opt && opt.size) || 3,
          color: (opt && opt.color) || '#ffd23f',
          gravity: (opt && opt.gravity !== undefined) ? opt.gravity : 0.25
        });
      }
    },
    coinBurst(x, y)  { this.spawn(x, y, PARTICLES.COIN, { color: '#ffd23f', speed: 3, gravity: 0.3, life: 24, size: 3 }); },
    enemyChunks(x, y) { this.spawn(x, y, PARTICLES.ENEMY, { color: '#e14b4b', speed: 3.2, gravity: 0.35, life: 28, size: 4 }); },
    dust(x, y)       { this.spawn(x, y, PARTICLES.DUST, { color: '#cbd5e1', speed: 1.6, gravity: 0.2, life: 18, size: 2, up: 0.6 }); },
    bossBurst(x, y)  { this.spawn(x, y, PARTICLES.BOSS, { color: '#a855f7', speed: 4, gravity: 0.3, life: 40, size: 5 }); },
    // 冲刺收尾气流
    dashTrail(x, y, dir) {
      this.spawn(x, y, 6, { color: '#8adcff', speed: 2.2, gravity: 0.05, life: 16, size: 3,
                            angle: dir > 0 ? Math.PI : 0, spread: 0.7 });
    },
    // 弹跳板向上的气流
    bounceDraft(x, y) {
      this.spawn(x, y, 8, { color: '#bfffd8', speed: 1.4, gravity: -0.03, life: 24, size: 2, up: 3.2 });
    },
    // 宝石收集爆散
    gemBurst(x, y) {
      this.spawn(x, y, 12, { color: '#9be2ff', speed: 3.4, gravity: 0.1, life: 30, size: 3 });
    },
    // 爱心拾取爆散
    heartBurst(x, y) {
      this.spawn(x, y, 10, { color: '#ff7aa8', speed: 2.6, gravity: 0.12, life: 26, size: 3 });
    },
    // 变大果实 / 变小爆散
    fruitBurst(x, y) {
      this.spawn(x, y, 12, { color: '#ffb23f', speed: 3.2, gravity: 0.12, life: 28, size: 3 });
    },
    shrinkBurst(x, y) {
      this.spawn(x, y, 10, { color: '#ffffff', speed: 2.8, gravity: 0.15, life: 20, size: 2 });
    },

    update() {
      for (const p of this.list) {
        p.x += p.vx; p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.98;
        p.life--;
      }
      if (this.list.length) this.list = this.list.filter((p) => p.life > 0);
    },
    draw() {
      for (const p of this.list) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        rect(p.x, p.y, p.size, p.size, p.color);
      }
      ctx.globalAlpha = 1;
    },
    clear() { this.list.length = 0; }
  };

        { id: 'restart',    label: '重新开始本关',   x, y: 312, w, h },
        { id: 'menu',       label: '返回主菜单',     x, y: 368, w, h }
      ];
    },
    deadButtons() {
      const w = 260, h = 46, x = VIEW.W / 2 - w / 2;
      return [
        { id: 'retry', label: Game.endless ? '重新开始无尽' : '重试本关', x, y: 330, w, h },
        { id: 'menu',  label: '返回主菜单', x, y: 388, w, h }
      ];
    },
    winButtons() {
      const w = 260, h = 46, x = VIEW.W / 2 - w / 2;
      return [
        { id: 'next', label: Game.endless ? '进入下一房间' : '进入下一关', x, y: 356, w, h },
        { id: 'menu', label: Game.endless ? '结束本局' : '返回主菜单', x, y: 404, w, h }
      ];
    },
    completeButtons() {
      const w = 260, h = 46;
      return [{ id: 'menu', label: '返回主菜单', x: VIEW.W / 2 - w / 2, y: 388, w, h }];
    },
    hudIcons() {
      return {
        pause:      { x: VIEW.W - 48, y: 14, w: 32, h: 32 },
        fullscreen: { x: VIEW.W - 48, y: 52, w: 32, h: 32 }
      };
    },
    // 虚拟按键：左下方向键，右下跳跃（低）+ 冲刺（高、偏左），错位防误触
    touchButtons() {
      const B = TOUCH.BTN, S = TOUCH.SMALL, M = TOUCH.MARGIN, G = TOUCH.GAP;
      const bottom = VIEW.H - M - B;
      return [
        { id: 'left',  x: M,           y: bottom, w: B, h: B },
        { id: 'right', x: M + B + G,   y: bottom, w: B, h: B },
        { id: 'jump',  x: VIEW.W - M - B,             y: bottom,       w: B, h: B },
        { id: 'dash',  x: VIEW.W - M - B - G - S,     y: bottom - 62,  w: S, h: S }
      ];
    }
  };

  // 点是否落在矩形内（菜单/按钮/触控命中检测）
  function hitRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  // 当前是否处于全屏（兼容各前缀）
  function isFullscreen() {
    const doc = document;
    return !!(doc.fullscreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement);
  }

  // 切换浏览器全屏（兼容 Chrome / Edge / Safari / Electron）
  function toggleFullscreen() {
    const doc = document;
    const el = doc.documentElement;
    const fsEl = doc.fullscreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;
    if (!fsEl) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) {
        try { req.call(el); } catch (e) {}
      }
    } else {
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
      if (exit) {
        try { exit.call(doc); } catch (e) {}
      }
    }
  }

  // ============================================================
  // 3.8 像素绘制 / 离屏预渲染（第四阶段性能优化）
  // ============================================================

  // 通用矩形绘制（支持指定目标画布，便于离屏预渲染）
  function pRect(g, x, y, w, h, color) {
    g.fillStyle = color;
    g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  // 每套主题对应的地形材质（顶部色 / 主体色 / 暗边 / 发光细节）
  const TERRAIN_PALETTES = {
    '暖绿': { mat: 'grass',   top: '#7fe08a', top2: '#46a85a', body: '#a87548', light: '#c99a6a', dark: '#7a5132', edge: '#5a3a22', glow: '#ffe28a' },
    '土黄': { mat: 'sand',    top: '#e8c58a', top2: '#c99b5c', body: '#b08954', light: '#d3ad78', dark: '#8a683c', edge: '#6a4a28', glow: '#ffd89a' },
    '灰紫': { mat: 'stone',   top: '#9a86b8', top2: '#6a5a86', body: '#6d5c88', light: '#8a78a8', dark: '#4f4268', edge: '#3a2f4a', glow: '#d8c2ff' },
    '深蓝': { mat: 'metal',   top: '#6a9ac8', top2: '#3a6a98', body: '#2f5478', light: '#4a7aa0', dark: '#1f3852', edge: '#16283a', glow: '#9be2ff' },
    '暗红': { mat: 'ember',   top: '#8a4a52', top2: '#5a2f38', body: '#4a242c', light: '#6a3640', dark: '#30161c', edge: '#220f14', glow: '#ff9a8a' },
    '深黑': { mat: 'stone',   top: '#4a4c5a', top2: '#2a2c3a', body: '#23252f', light: '#3a3d4a', dark: '#161820', edge: '#101218', glow: '#cfd8ff' },
    '熔岩': { mat: 'ember',   top: '#8a3a2a', top2: '#5a2418', body: '#3a1812', light: '#5a2a1e', dark: '#240c08', edge: '#180806', glow: '#ffb066' },
    '天空': { mat: 'grass',   top: '#9ed4ff', top2: '#5ea8e0', body: '#6a9ec4', light: '#8ab8d8', dark: '#4a7a9e', edge: '#2a4a5c', glow: '#e8f8ff' },
    '水晶': { mat: 'crystal', top: '#b8a2f0', top2: '#7a68c0', body: '#5a4a8c', light: '#8a78c0', dark: '#3a3168', edge: '#241d40', glow: '#d8c2ff' },
    '冰川': { mat: 'ice',     top: '#e8f8ff', top2: '#a8dcf0', body: '#7fc0dc', light: '#b8e8f8', dark: '#5a98b8', edge: '#3a6a88', glow: '#ffffff' },
    '废墟': { mat: 'stone',   top: '#9a8a78', top2: '#6a5a4c', body: '#5a4a3e', light: '#7a6656', dark: '#3f342c', edge: '#2a221c', glow: '#ffe0a0' },
    '星海': { mat: 'metal',   top: '#4a5a8a', top2: '#2a3458', body: '#1f2848', light: '#3a4a78', dark: '#121830', edge: '#0a0e1c', glow: '#aaccff' },
    '熔火': { mat: 'ember',   top: '#a84a2a', top2: '#6a2010', body: '#4a1408', light: '#7a2a14', dark: '#2a0a04', edge: '#1a0502', glow: '#ff8a3f' },
    '地宫': { mat: 'stone',   top: '#5a7a4a', top2: '#3a5a2e', body: '#2f3d2a', light: '#4a5e40', dark: '#1e281a', edge: '#141c10', glow: '#b8ff9a' },
    '极光': { mat: 'ice',     top: '#b8f0e8', top2: '#6ac8d8', body: '#3a7a8c', light: '#6aaabc', dark: '#24505c', edge: '#163840', glow: '#d8fffa' },
    '星核': { mat: 'crystal', top: '#c8a2f8', top2: '#7a4ac0', body: '#3a2a5e', light: '#6a4a9e', dark: '#241a40', edge: '#140e24', glow: '#ffd1ff' }
  };
  function terrainStyle() {
    const th = THEMES[(Game.themeIndex || 0) % THEMES.length] || THEMES[0];
    return TERRAIN_PALETTES[th.name] || TERRAIN_PALETTES['暖绿'];
  }

  // 地面平台像素画法（按主题材质绘制，砖块 / 冰层 / 金属 / 熔岩裂纹等）
  function drawGroundShape(g, p) {
    const s = terrainStyle();
    const x = Math.round(p.x), y = Math.round(p.y), w = p.w, h = p.h;
    pRect(g, x, y, w, 5, s.top);
    pRect(g, x, y + 5, w, 3, s.top2);
    for (let by = y + 8; by < y + h - 4; by += 12) {
      const odd = Math.floor((by - y - 8) / 12) % 2 === 1;
      for (let bx = x; bx < x + w; bx += 24) {
        const ox = odd ? bx + 12 : bx;
        const bw = Math.min(22, x + w - ox);
        if (bw <= 0) continue;
        pRect(g, ox, by, bw, 10, s.body);
        pRect(g, ox, by, bw, 2, s.light);
        pRect(g, ox, by + 8, bw, 2, s.dark);
      }
    }
    pRect(g, x, y + h - 4, w, 4, s.edge);
    // 材质细节
    if (s.mat === 'grass') {
      for (let bx = x + 10; bx < x + w - 4; bx += 28) {
        pRect(g, bx, y - 2, 3, 2, s.top);
        pRect(g, bx + 5, y - 3, 2, 3, s.top2);
      }
    } else if (s.mat === 'ice') {
      for (let bx = x + 8; bx < x + w; bx += 44) {
        pRect(g, bx, y + 9, 2, 10, s.light);
        pRect(g, bx + 2, y + 16, 8, 2, s.top);
      }
    } else if (s.mat === 'ember') {
      for (let bx = x + 12; bx < x + w; bx += 56) {
        pRect(g, bx, y + 10, 2, 8, s.glow);
        pRect(g, bx + 2, y + 16, 7, 2, s.glow);
        pRect(g, bx + 9, y + 18, 2, 5, s.glow);
      }
    } else if (s.mat === 'metal') {
      pRect(g, x, y + 9, w, 1, s.dark);
      for (let bx = x + 6; bx < x + w; bx += 24) {
        pRect(g, bx, y + 10, 2, 2, s.top);
        pRect(g, bx + 16, y + 10, 2, 2, s.top);
      }
    } else if (s.mat === 'crystal') {
      for (let bx = x + 16; bx < x + w; bx += 64) {
        pRect(g, bx, y + 9, 2, 16, s.glow);
        pRect(g, bx + 2, y + 9, 8, 2, s.glow);
        pRect(g, bx - 4, y + 21, 10, 2, s.top);
      }
    } else if (s.mat === 'sand') {
      for (let by = y + 14; by < y + h - 6; by += 18) {
        pRect(g, x + 6, by, w - 12, 2, s.dark);
      }
    }
  }

  // 浮台像素画法（材质与地面一致，顶部保留高光）
  function drawLedgeShape(g, p) {
    const s = terrainStyle();
    const x = Math.round(p.x), y = Math.round(p.y), w = p.w, h = p.h;
    pRect(g, x, y, w, h, s.body);
    pRect(g, x, y, w, 4, s.top);
    pRect(g, x, y + 4, w, 2, s.top2);
    pRect(g, x, y + h - 3, w, 3, s.dark);
    for (let bx = x + 6; bx < x + w; bx += 14) {
      pRect(g, bx, y + 5, 2, h - 8, s.dark);
    }
    if (s.mat === 'grass') {
      for (let bx = x + 8; bx < x + w - 4; bx += 24) {
        pRect(g, bx, y - 2, 3, 2, s.top);
      }
    } else if (s.mat === 'ice') {
      pRect(g, x, y, 2, h, s.light);
      pRect(g, x + w - 2, y, 2, h, s.light);
      for (let bx = x + 12; bx < x + w - 6; bx += 30) {
        pRect(g, bx, y + 6, 2, 6, s.glow);
      }
    } else if (s.mat === 'metal') {
      for (let bx = x + 4; bx < x + w; bx += 18) {
        pRect(g, bx, y + 6, 2, 2, s.top);
        pRect(g, bx, y + h - 5, 2, 2, s.top);
      }
    } else if (s.mat === 'ember') {
      for (let bx = x + 10; bx < x + w; bx += 40) {
        pRect(g, bx, y + 6, 2, 5, s.glow);
        pRect(g, bx + 2, y + 10, 5, 2, s.glow);
      }
    } else if (s.mat === 'crystal') {
      for (let bx = x + 14; bx < x + w - 8; bx += 46) {
        pRect(g, bx, y + 6, 2, 7, s.glow);
        pRect(g, bx + 2, y + 6, 5, 2, s.glow);
      }
    }
  }

  function drawPlatformShape(g, p) {
    if (p.kind === 'ground') drawGroundShape(g, p);
    else drawLedgeShape(g, p);
  }

  // 视口裁剪：仅绘制相机视野（含两侧余量）内的对象
  function inView(x, w) {
    const pad = 80;
    return x + (w || 0) > Camera.x - pad && x < Camera.x + VIEW.W + pad;
  }

  // 静态平台离屏预渲染：按 1600px 分块懒加载，减少一次性大画布内存
  const StaticLayer = {
    CHUNK_W: 1600,
    canvas: null,
    chunks: [],
    width: 0,
    failed: false,
    build() {
      this.canvas = null;
      this.chunks = [];
      this.width = Math.max(VIEW.W, Math.ceil(Level.data ? Level.data.width : VIEW.W));
      this.failed = false;
    },
    ensureChunk(i) {
      if (this.chunks[i]) return this.chunks[i];
      if (this.failed) return null;
      const cx = i * this.CHUNK_W;
      const cw = Math.min(this.CHUNK_W, this.width - cx);
      if (cw <= 0) return null;
      try {
        const cv = document.createElement('canvas');
        cv.width = cw;
        cv.height = VIEW.H;
        const g = cv.getContext('2d');
        if (!g) { this.failed = true; return null; }
        g.imageSmoothingEnabled = false;
        g.translate(-cx, 0);
        for (const p of Level.platforms) {
          if (p.move || p.fall || p.oneWay || p.gate) continue;
          if (p.x + p.w < cx || p.x > cx + cw) continue;
          drawPlatformShape(g, p);
        }
        this.chunks[i] = cv;
        return cv;
      } catch (e) {
        this.failed = true;
        return null;
      }
    },
    draw() {
      if (!this.failed) {
        const start = Math.max(0, Math.floor(Camera.x / this.CHUNK_W));
        const last = Math.ceil(this.width / this.CHUNK_W) - 1;
        const end = Math.min(Math.floor((Camera.x + VIEW.W - 1) / this.CHUNK_W), last);
        let ok = true;
        for (let i = start; i <= end; i++) {
          const cv = this.ensureChunk(i);
          if (!cv) { ok = false; break; }
          ctx.drawImage(cv, i * this.CHUNK_W, 0);
        }
        if (ok) return;
      }
      for (const p of Level.platforms) {
        if (p.move || p.fall || p.oneWay || p.gate) continue;
        if (!inView(p.x, p.w)) continue;
        drawPlatformShape(ctx, p);
      }
    }
  };

  // 小尺寸离屏瓦片（背景山脉 / 树）
  function makeTile(w, h, paint) {
    try {
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      const g = cv.getContext('2d');
      if (!g) return null;
      g.imageSmoothingEnabled = false;
      paint(g);
      return cv;
    } catch (e) {
      return null;
    }
  }

  const BgTiles = {
    mountain: null,
    tree: null,
    far: null,
    build(theme) {
      const th = theme || THEMES[0];
      // 最远层山影：220 间距循环，低透明度叠在天空上
      this.far = makeTile(220, 100, (g) => {
        g.globalAlpha = 0.34;
        for (let i = 0; i <= 220; i += 10) {
          const peak = Math.sin((i / 220) * Math.PI) * 72;
          pRect(g, i, 100 - peak, 10, peak, th.mountain);
        }
        g.globalAlpha = 1;
      });
      // 远景山丘：120 间距循环（按关卡主题取色）
      this.mountain = makeTile(140, 116, (g) => {
        for (let i = 0; i <= 140; i += 8) {
          const peak = Math.sin((i / 140) * Math.PI) * 110;
          pRect(g, i, 116 - peak, 8, peak, th.mountain);
        }
      });
      // 中景树林：90 间距循环
      this.tree = makeTile(90, 82, (g) => {
        pRect(g, 17, 46, 6, 36, th.trunk);
        for (let y = 0; y < 5; y++) {
          const rw = 36 - y * 6;
          pRect(g, 20 - rw / 2, 36 - y * 8, rw, 10, th.tree);
        }
      });
      this.theme = th;
    }
  };

  // ============================================================
  // 4. 输入模块
  // ============================================================
  const Input = {
    left: false, right: false, up: false, down: false,
    jumpHeld: false,                 // 跳跃键按住状态（用于可变跳跃高度）
    jumpPressed: false,              // 跳跃按下（边缘触发）
    jumpReleased: false,             // 跳跃松开（边缘触发，用于短按截断）
    dashPressed: false,
    restartPressed: false,
    pausePressed: false,
    pauseReqPressed: false,          // P：联机客人请求暂停
    confirmPressed: false,
    fullscreenPressed: false,
    mutePressed: false,              // M 静音切换（边缘触发）
    mouseX: 0, mouseY: 0,
    tapped: false, tapX: 0, tapY: 0, // 指针点击坐标（菜单/图标命中检测）
    touchMode: false,                // 是否显示虚拟按键
    pointerButtons: {},              // pointerId -> 虚拟按键 id（多点触控）
    gpLeft: false, gpRight: false, gpUp: false, gpDown: false,
    gpJump: false, gpDash: false, gpPause: false,

    init() {
      // 自动识别触屏设备：PC 默认隐藏虚拟按键
      this.touchMode = window.matchMedia('(pointer: coarse)').matches ||
        (navigator.maxTouchPoints > 0 &&
         /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent));

      // 任意用户手势解锁音频（浏览器自动播放策略）
      const unlockAudio = () => Sound.unlock();

      window.addEventListener('keydown', (e) => {
        if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) {
          e.preventDefault();
        }
        unlockAudio();
        if (e.repeat) return;

        // 设置页按键重映射：捕获下一次按键
        if (Game.capturingKey && Game.state === 'settings') {
          e.preventDefault();
          if (e.code === 'Escape') {
            Game.capturingKey = null;
            Sound.pause();
            return;
          }
          Storage.data.keys[Game.capturingKey] = e.code;
          Storage.save();
          Game.capturingKey = null;
          Sound.click();
          return;
        }

        const keys = Storage.data.keys;
        if (e.code === 'KeyA' || e.code === 'ArrowLeft')  this.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') this.right = true;
        if (e.code === 'KeyW' || e.code === 'ArrowUp')    this.up = true;
        if (e.code === 'KeyS' || e.code === 'ArrowDown')  this.down = true;
        if (e.code === keys.jump)       { this.jumpPressed = true; this.jumpHeld = true; this.confirmPressed = true; }
        if (e.code === 'Enter')         this.confirmPressed = true;
        if (e.code === keys.dash)       this.dashPressed = true;
        if (e.code === 'KeyR')          this.restartPressed = true;
        if (e.code === 'Escape')        this.pausePressed = true;
        if (e.code === 'KeyP')          this.pauseReqPressed = true;
        if (e.code === 'KeyF')          this.fullscreenPressed = true;
        if (e.code === 'KeyM')          this.mutePressed = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft')  this.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') this.right = false;
        if (e.code === 'KeyW' || e.code === 'ArrowUp')    this.up = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown')  this.down = false;
        if (e.code === Storage.data.keys.jump) {
          this.jumpHeld = false; this.jumpReleased = true;
        }
      });

      // 指针坐标换算到 960×540 逻辑坐标
      const toGame = (e) => {
        const r = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - r.left) * (VIEW.W / r.width),
          y: (e.clientY - r.top) * (VIEW.H / r.height)
        };
      };

      canvas.addEventListener('pointermove', (e) => {
        const p = toGame(e);
        this.mouseX = p.x; this.mouseY = p.y;
      });

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        unlockAudio();
        const p = toGame(e);
        this.mouseX = p.x; this.mouseY = p.y;
        this.tapped = true; this.tapX = p.x; this.tapY = p.y;

        // 游戏中按下虚拟按键
        if (Game.state === 'playing') {
          const btn = UI.touchButtons().find((b) => hitRect(p.x, p.y, b));
          if (btn) {
            this.pointerButtons[e.pointerId] = btn.id;
            this.pressTouch(btn.id, true);
            try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
          }
        }
      });

      const release = (e) => {
        const id = this.pointerButtons[e.pointerId];
        if (id) { this.pressTouch(id, false); delete this.pointerButtons[e.pointerId]; }
      };
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);

      // 阻止移动端双击缩放 / 长按菜单
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('gesturestart', (e) => e.preventDefault());

      window.addEventListener('blur', () => {
        this.left = this.right = this.up = this.down = false;
        this.jumpHeld = false;
        for (const k in this.pointerButtons) this.pressTouch(this.pointerButtons[k], false);
        this.pointerButtons = {};
      });
    },

    // 手柄轮询：左摇杆/十字键移动，A 跳跃，X/RB 冲刺，Start 暂停
    pollGamepad() {
      if (!navigator.getGamepads) return;
      let gp = null;
      try {
        for (const p of navigator.getGamepads()) {
          if (p && p.connected) { gp = p; break; }
        }
      } catch (e) { return; }
      if (!gp) {
        this.gpLeft = this.gpRight = this.gpUp = this.gpDown = false;
        this.gpJump = this.gpDash = this.gpPause = false;
        return;
      }
      const ax = gp.axes[0] || 0;
      const ay = gp.axes[1] || 0;
      const btn = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const gl = ax < -0.35 || btn(12);
      const gr = ax > 0.35 || btn(13);
      const gu = ay < -0.45 || btn(15);
      const gd = ay > 0.45 || btn(14);
      if (gl) this.left = true;
      else if (this.gpLeft) this.left = false;
      if (gr) this.right = true;
      else if (this.gpRight) this.right = false;
      if (gu) this.up = true;
      else if (this.gpUp) this.up = false;
      if (gd) this.down = true;
      else if (this.gpDown) this.down = false;
      this.gpLeft = gl; this.gpRight = gr; this.gpUp = gu; this.gpDown = gd;

      const j = btn(0) || btn(1);
      if (j && !this.gpJump) {
        this.jumpPressed = true;
        this.jumpHeld = true;
        this.confirmPressed = true;
      }
      if (!j && this.gpJump) {
        this.jumpHeld = false;
        this.jumpReleased = true;
      }
      this.gpJump = j;

      const d = btn(2) || btn(5);
      if (d && !this.gpDash) this.dashPressed = true;
      this.gpDash = d;

      const s = btn(9);
      if (s && !this.gpPause) this.pausePressed = true;
      this.gpPause = s;
    },

    // 处理虚拟按键按下/松开
    pressTouch(id, down) {
      if (id === 'left')  this.left = down;
      if (id === 'right') this.right = down;
      if (id === 'jump') {
        if (down) { this.jumpPressed = true; this.jumpHeld = true; }
        else { this.jumpHeld = false; this.jumpReleased = true; }
      }
      if (id === 'dash' && down) this.dashPressed = true;
    },

    consumeJump()        { const v = this.jumpPressed;    this.jumpPressed = false;    return v; },
    consumeJumpRelease() { const v = this.jumpReleased;   this.jumpReleased = false;   return v; },
    consumeDash()        { const v = this.dashPressed;    this.dashPressed = false;    return v; },
    consumeRestart()     { const v = this.restartPressed; this.restartPressed = false; return v; },
    consumePause()       { const v = this.pausePressed;   this.pausePressed = false;   return v; },
    consumePauseRequest(){ const v = this.pauseReqPressed; this.pauseReqPressed = false; return v; },
    consumeConfirm()     { const v = this.confirmPressed; this.confirmPressed = false; return v; },
    consumeFullscreen()  { const v = this.fullscreenPressed; this.fullscreenPressed = false; return v; },
    consumeMute()        { const v = this.mutePressed;    this.mutePressed = false;    return v; },
    consumeTap() {
      if (!this.tapped) return null;
      this.tapped = false;
      return { x: this.tapX, y: this.tapY };
    },

    clearFrame() {
      this.jumpPressed = false;
      this.jumpReleased = false;
      this.dashPressed = false;
      this.restartPressed = false;
      this.pausePressed = false;
      this.pauseReqPressed = false;
      this.confirmPressed = false;
      this.fullscreenPressed = false;
      this.mutePressed = false;
      this.tapped = false;
    }
  };

  // ============================================================
  // 5. 关卡模块：平台、移动平台、敌人、金币、尖刺、Boss、旗帜
  // ============================================================
  const Level = {
    index: 0,
    data: null,
    platforms: [],
    fallPlats: [],      // 下坠平台（同时加入 platforms 参与碰撞）
    pads: [],           // 弹跳板
    checkpoints: [],    // 检查点
    activeCheckpoint: -1,
    enemies: [],
    coins: [],
    spikes: [],
    boss: null,
    bossDefeated: false, // Boss 是否已被击败（死亡重生时不重新生成）
    flag: null,
    flagTrigger: null,
    snapshot: null,     // 检查点快照（金币数 / 金币状态 / 敌人状态）
    bossFightStarted: false, // 是否已进入 Boss 战（决定 Boss 房重生点）
    bossIntroT: 0,           // Boss 入场演出剩余帧数（期间 Boss 不攻击）
    animTick: 0,        // 关卡内平台动画计时（仅游戏进行时递增，切关重置）
    popups: [],         // 收集数字弹出
    trail: [],          // 冲刺残影
    rings: [],          // 二段跳扩散光环
    gems: [],           // 本关宝石（隐藏收集物）
    hearts: [],         // 爱心拾取（+1 生命，最多 5 颗）
    fruits: [],         // 变大果实
    traps: [],          // 陷阱（火球 / 激光 / 捕兽夹）
    projectiles: [],    // 火球弹体
    lava: null,         // 熔岩上涨状态
    gates: [],          // 机关门与开关
    hints: [],          // 首次机制提示（经过后消失）

    // index 可为关卡序号；传入数据对象时为运行时关卡（无尽模式）
    load(index) {
      const runtime = index && typeof index === 'object' ? index : null;
      this.index = runtime ? -1 : index;
      const src = runtime || LEVELS[index];
      this.runtime = !!runtime;
      this.data = src;
      this.biome = src.biome || BIOME_BY_LEVEL[this.index] || {};   // 本关环境机制（冰面 / 风）
      const off = src.repeatOffset || 0;   // >0 时把前半段复制到后半段，实现关卡长度翻倍
      const mirror = !!(off && !src.noMirror); // 默认镜像复制，避免后半段与前半段完全重复
      const mapX = (x, w) => mirror ? off * 2 - x - (w || 0) : x + off;
      const baseCount = src.platforms.length;

      // 深拷贝平台并记录 baseX/baseY（移动平台需要）
      this.platforms = src.platforms.map((p) => ({
        ...p,
        baseX: p.x, baseY: p.y,
        dx: 0, dy: 0
      }));
      // 后半段复制（镜像或平移，并做变体：部分浮台改为单向平台、移动平台变速）
      if (off) {
        let ledgeSeq = 0;
        for (const p of src.platforms) {
          const clone = {
            ...p, x: mapX(p.x, p.w), baseX: mapX(p.x, p.w), baseY: p.y, dx: 0, dy: 0
          };
          if (clone.move) {
            // 移动平台变体：振幅与速度略变、相位错开，避免前后段完全同节奏
            clone.move = {
              ...clone.move,
              range: Math.round((p.move.range * 1.15) * 10) / 10,
              speed: p.move.speed * 1.18,
              phase: p.move.phase + 2.4
            };
          } else if (clone.kind === 'ledge' && !clone.oneWay) {
            ledgeSeq++;
            // 每 3 块普通浮台改为单向平台，增加后半段路线差异
            if (ledgeSeq % 3 === 0) clone.oneWay = true;
          }
          this.platforms.push(clone);
        }
      }
      // 下坠平台：附带独立状态机，并加入碰撞集合
      this.fallPlats = (src.fallPlats || []).map((f) => ({
        x: f.x, y: f.y, w: f.w, h: f.h || 16, kind: 'ledge',
        baseX: f.x, baseY: f.y, dx: 0, dy: 0,
        fall: true, state: 'idle',   // idle → gone → idle
        timer: 0, alpha: 1, respawn: 0
      }));
      if (off) {
        for (const f of src.fallPlats || []) {
          this.fallPlats.push({
            x: mapX(f.x, f.w), y: f.y, w: f.w, h: f.h || 16, kind: 'ledge',
            baseX: mapX(f.x, f.w), baseY: f.y, dx: 0, dy: 0,
            fall: true, state: 'idle', timer: 0, alpha: 1, respawn: 0
          });
        }
      }
      for (const f of this.fallPlats) this.platforms.push(f);
      // 弹跳板 / 检查点
      this.pads = (src.pads || []).map((p) => ({
        x: p.x, y: p.y, w: p.w || 52,
        squash: 0, cool: 0
      }));
      if (off) {
        for (const p of src.pads || []) {
          const w = p.w || 52;
          this.pads.push({ x: mapX(p.x, w), y: p.y, w, squash: 0, cool: 0 });
        }
      }
      this.checkpoints = (src.checkpoints || []).map((c) => ({
        x: c.x, y: c.y, activated: false
      }));
      if (off) {
        for (const c of src.checkpoints || []) {
          this.checkpoints.push({ x: mapX(c.x, 0), y: c.y, activated: false });
        }
      }
      this.activeCheckpoint = -1;
      this.bossDefeated = false;
      this.snapshot = null;
      this.bossFightStarted = false;
      this.bossIntroT = 0;
      this.animTick = 0;

      // 移动平台先摆到相位 0 的初始位置，避免开局第一帧从基准点瞬移
      for (const p of this.platforms) {
        if (!p.move) continue;
        const s = Math.sin(p.move.phase);
        const eased = Math.sign(s) * Math.pow(Math.abs(s), MECH.MOVER_EASE_POWER);
        if (p.move.axis === 'x') p.x = p.baseX + eased * p.move.range;
        else p.y = p.baseY + eased * p.move.range;
      }

      // 尖刺 / 金币 / 敌人配置（含后半段副本）
      this.spikes = src.spikes.map((s) => ({ ...s }));
      this.coinCfgs = src.coins.map((c) => ({ ...c }));
      this.enemyCfgs = src.enemies.map((e) => ({ ...e }));
      if (off) {
        for (const s of src.spikes) this.spikes.push({ ...s, x: mapX(s.x, s.w) });
        for (const c of src.coins) this.coinCfgs.push({ ...c, x: mapX(c.x, COIN_SIZE.w) });
        for (const e of src.enemies) {
          this.enemyCfgs.push({
            ...e, x: mapX(e.x, ENEMY_SIZE.w),
            dir: mirror ? -e.dir : e.dir,
            platform: e.platform + baseCount
          });
        }
      }
      // Boss 配置与 Boss 房入口（仅少数关启用，Boss 关不平移镜像）
      this.bossCfg = src.boss ? { ...src.boss } : null;
      this.bossArena = src.bossArena ? { ...src.bossArena } : null;
      if (off && this.bossCfg) {
        this.bossCfg.platform += baseCount;
        this.bossCfg.x = mapX(this.bossCfg.x, BOSS_SIZE.w);
      }
      if (off && this.bossArena) this.bossArena.x = mapX(this.bossArena.x, PLAYER_SIZE.w);
      // 兜底修正：静态尖刺必须落在实体平台上，避免悬空在深坑中央
      this.sanitizeSpikes();

      this.resetEnemies();
      this.resetCoins();
      this.resetBoss();
      this.flag = src.flag ? { ...src.flag } : null;
      this.flagTrigger = src.flagTrigger ? { ...src.flagTrigger } : null;
      this.popups = [];
      this.trail = [];
      this.rings = [];
      // 宝石：已收集过的关卡不再重复显示（藏在第一段隐藏路线）
      // 运行时关卡（无尽）由 src.gems 直接提供
      const spots = [];
      if (src.gems) {
        // 第二篇章等运行时提供的宝石位置：同样遵循“本关已收集则不再出现”
        if (Game.multiplayer || !Storage.data.gems[this.index]) {
          for (const g of src.gems) spots.push({ ...g });
        }
      } else {
        const spot = GEM_SPOTS[this.index];
        // 联机模式统一显示宝石，保证房主与客人场景一致
        if (spot && (Game.multiplayer || !Storage.data.gems[this.index])) {
          spots.push(spot);
        }
      }
      this.gems = spots.map((s) => ({
        x: s.x, y: s.y, w: GEM_SIZE.w, h: GEM_SIZE.h, collected: false
      }));
      // 爱心拾取物：前半段 + 后半段各一份（每次进入关卡重置）
      const heartSpots = src.hearts || HEART_SPOTS[this.index] || [];
      this.hearts = [];
      for (const h of heartSpots) {
        this.hearts.push({ x: h.x, y: h.y, w: 16, h: 16, collected: false });
        if (off) {
          this.hearts.push({ x: mapX(h.x, 16), y: h.y, w: 16, h: 16, collected: false });
        }
      }
      // 变大果实：前半段 + 后半段各一份
      const fruit = src.fruits ? src.fruits[0] : FRUIT_SPOTS[this.index];
      this.fruits = [];
      if (fruit) {
        this.fruits.push({ x: fruit.x, y: fruit.y, w: 18, h: 18, collected: false });
        if (off) this.fruits.push({ x: mapX(fruit.x, 18), y: fruit.y, w: 18, h: 18, collected: false });
      }
      // 陷阱：捕兽夹 / 火球发射口 / 周期激光 / 滚锯 / 摆锤（后半段镜像复制）
      const trapW = (t) => t.kind === 'laser' ? (t.w || 120)
        : t.kind === 'bear' ? TRAP.BEAR_W
        : t.kind === 'saw' ? TRAP.SAW_W
        : t.kind === 'pendulum' ? TRAP.PEND_W
        : t.kind === 'crusher' ? TRAP.CRUSHER_W
        : t.kind === 'popspike' ? TRAP.SPIKE_W : 24;
      const makeTrap = (t, x, dir) => {
        const kind = t.kind;
        const w = kind === 'laser' ? (t.w || 120)
          : kind === 'bear' ? TRAP.BEAR_W
          : kind === 'saw' ? TRAP.SAW_W
          : kind === 'pendulum' ? TRAP.PEND_W
          : kind === 'crusher' ? TRAP.CRUSHER_W
          : kind === 'popspike' ? TRAP.SPIKE_W : 24;
        const h = kind === 'laser' ? 10
          : kind === 'bear' ? TRAP.BEAR_H
          : kind === 'saw' ? TRAP.SAW_W
          : kind === 'pendulum' ? TRAP.PEND_W
          : kind === 'crusher' ? TRAP.CRUSHER_H
          : kind === 'popspike' ? TRAP.SPIKE_H : 24;
        const tr = {
          kind, x, w, h,
          y: kind === 'bear' ? GROUND_Y - TRAP.BEAR_H
            : kind === 'crusher' ? TRAP.CRUSHER_TOP
            : kind === 'popspike' ? GROUND_Y
            : (t.y !== undefined ? t.y : GROUND_Y - 30),
          baseY: kind === 'crusher' ? TRAP.CRUSHER_TOP
            : kind === 'popspike' ? GROUND_Y : undefined,
          dir: dir || t.dir || 1,
          timer: t.phase || 0,
          fireTimer: 0, active: false, warn: false, snap: 0, cool: 0,
          armed: false                         // 玩家接近后才启动
        };
        if (kind === 'saw') {
          // 滚锯：沿地面左右巡逻，x 为巡逻中心
          tr.baseX = x;
          tr.range = t.range || TRAP.SAW_RANGE;
          tr.speed = t.speed || TRAP.SAW_SPEED;
          tr.y = GROUND_Y - TRAP.SAW_W - 2;
          tr.x = x + Math.sin(tr.timer * tr.speed) * tr.range;
        } else if (kind === 'pendulum') {
          // 摆锤：x 为悬挂点，球体位置随摆角计算
          tr.pivotX = x;
          tr.pivotY = t.y !== undefined ? t.y : TRAP.PEND_PIVOT_Y;
          tr.len = t.len || TRAP.PEND_LEN;
          tr.amp = t.amp !== undefined ? t.amp : TRAP.PEND_AMP;
          tr.speed = t.speed || TRAP.PEND_SPEED;
          tr.angle = Math.sin(tr.timer * tr.speed) * tr.amp;
          tr.x = tr.pivotX + Math.sin(tr.angle) * tr.len - w / 2;
          tr.y = tr.pivotY + Math.cos(tr.angle) * tr.len - h / 2;
        }
        return tr;
      };
      this.traps = [];
      for (const t of src.traps || LEVEL_TRAPS[this.index] || []) {
        this.traps.push(makeTrap(t, t.x, t.dir));
        if (off) {
          this.traps.push(makeTrap(t, mapX(t.x, trapW(t)), -t.dir));
        }
      }
      // 普通 / 硬核模式额外布置滚锯与摆锤（休闲模式只有捕兽夹）
      // 联机模式固定“普通”陷阱配置，避免不同玩家的本地难度造成场景不同步
      const allowedKinds = Game.multiplayer
        ? TRAP_MODES.normal
        : (TRAP_MODES[Storage.data.difficulty] || TRAP_MODES.normal);
      if (!this.runtime && this.index >= 2) {
        const grounds = this.platforms.filter(
          (p) => p.kind === 'ground' && p.w >= 260 && p.x > 700
        );
        if (grounds.length) {
          if (allowedKinds.includes('saw')) {
            const gp = grounds[Math.floor(grounds.length * 0.4)];
            const cx = gp.x + gp.w / 2;
            this.traps.push(makeTrap({ kind: 'saw', x: cx }, cx));
          }
          if (allowedKinds.includes('pendulum') && this.index >= 3) {
            const gp = grounds[Math.floor(grounds.length * 0.7)];
            const cx = gp.x + gp.w / 2;
            this.traps.push(makeTrap({ kind: 'pendulum', x: cx }, cx));
          }
        }
      }
      // 后半段关卡（第 9~16 关）追加落锤 / 地刺，让旧关卡难度继续递进
      if (!this.runtime && this.index >= 8 && this.index < 16 && !this.bossCfg) {
        const late = this.platforms.filter(
          (p) => p.kind === 'ground' && p.w >= 260 && p.x > 900
        );
        if (late.length && allowedKinds.includes('crusher')) {
          const gp = late[Math.floor(late.length * 0.35)];
          const cx = gp.x + gp.w * 0.65;
          this.traps.push(makeTrap({ kind: 'crusher', x: Math.round(cx - 28) }, Math.round(cx - 28)));
        }
        if (late.length && this.index >= 11 && allowedKinds.includes('popspike')) {
          const gp = late[Math.floor(late.length * 0.8)];
          const cx = gp.x + gp.w * 0.45;
          this.traps.push(makeTrap({ kind: 'popspike', x: Math.round(cx - 23) }, Math.round(cx - 23)));
        }
      }
      // 按难度过滤陷阱种类（火球仅硬核；休闲仅捕兽夹）
      this.traps = this.traps.filter((t) => allowedKinds.includes(t.kind));
      // 休闲难度：第二篇章的机械陷阱会被过滤，补少量捕兽夹保持节奏
      if (!this.runtime && this.index >= 16 && !Game.multiplayer &&
          Storage.data.difficulty === 'casual') {
        const safeEnd = this.bossArena ? this.bossArena.x - 180 : this.data.width;
        const grounds = this.platforms.filter((p) =>
          p.kind === 'ground' && p.w >= 240 && p.x > 800 && p.x < safeEnd);
        const spots = [
          grounds[Math.floor(grounds.length * 0.3)],
          grounds[Math.floor(grounds.length * 0.65)]
        ];
        for (const g of spots) {
          if (!g) continue;
          const bx = Math.round(g.x + g.w * 0.55);
          if (this.traps.some((t) => Math.abs(t.x - bx) < 140)) continue;
          this.traps.push(makeTrap({ kind: 'bear', x: bx }, bx));
        }
      }
      // 出生点安全区：避免刚加载 / 刚复活就踩到陷阱
      this.traps = this.traps.filter(
        (t) => Math.abs(t.x + t.w / 2 - src.spawn.x) > TRAP.SAFE_RADIUS
      );
      // 兜底修正：地面型陷阱必须落在实体平台上，避免悬空在深坑里
      this.sanitizeTraps();
      this.projectiles = [];
      // 熔岩上涨状态（部分关卡）
      this.lava = this.biome.lava
        ? { y: this.biome.lava.start, cap: this.biome.lava.cap,
            speed: this.biome.lava.speed || LAVA.DEFAULT_SPEED }
        : null;
      // 机关门：门体作为动态平台参与碰撞，触碰开关后升起
      this.gates = [];
      const gateCfg = src.gates !== undefined ? src.gates : GATES_BY_LEVEL[this.index];
      const addGate = (cfg, x, swX) => {
        const sw = { x: swX, y: cfg.switch.y, w: cfg.switch.w, h: cfg.switch.h };
        const gate = {
          x, y: cfg.y, w: cfg.w, h: cfg.h, kind: 'ledge',
          gate: true, opened: false, openT: 0, baseY: cfg.y, switch: sw
        };
        this.gates.push(gate);
        this.platforms.push(gate);
      };
      if (gateCfg) {
        addGate(gateCfg, gateCfg.x, gateCfg.switch.x);
        if (off) {
          addGate(gateCfg, mapX(gateCfg.x, gateCfg.w), mapX(gateCfg.switch.x, gateCfg.switch.w));
        }
      }
      // 首次机制提示（本次关卡流程内显示一次）
      this.hints = (src.hints || LEVEL_HINTS[this.index] || []).map((h) => ({ ...h, seen: false }));

      // 静态平台预渲染到离屏画布（关卡切换时自动替换并释放旧图）
      StaticLayer.build();
    },

    resetEnemies() {
      // 难度倍率；无尽模式随房间数缓慢提速（上限 1.6 倍）
      const endlessMul = Game.endless
        ? Math.min(1.6, 1 + (Game.endlessRoom - 1) * 0.04) : 1;
      // 第二篇章（第 17 关起）敌人基础速度随关卡序号继续增长
      const levelMul = this.index >= 16
        ? 1 + (this.index - 15) * 0.025 : 1;
      // 联机模式使用统一倍率，客机与房主的初始敌人状态保持一致
      const mult = (Game.multiplayer ? 1 : Storage.enemySpeedMul()) *
        endlessMul * levelMul;
      const cycle = this.data.enemyTypes || ENEMY_TYPES_BY_LEVEL[this.index] ||
        ['walker', 'charger', 'hopper', 'flyer', 'spiky'];
      this.enemies = this.enemyCfgs.map((cfg, i) => {
        const plat = this.platforms[cfg.platform] || this.platforms[0];
        const type = cfg.type || cycle[i % cycle.length];
        // 飞行 / 幽灵种默认悬浮在平台上方，其它种站在平台顶面
        const baseY = plat.y - ENEMY_SIZE.h -
          (type === 'flyer' || type === 'ghost' ? 40 : 0);
        // 精英怪：多 1 点生命、移动略快，外观带金色光环
        const elite = !!cfg.elite;
        const mul = mult * (elite ? 1.12 : 1);
        return {
          x: cfg.x, y: baseY, baseY,
          w: ENEMY_SIZE.w, h: ENEMY_SIZE.h,
          dir: cfg.dir, speed: cfg.speed * mul,
          baseSpeed: cfg.speed * mul,
          anim: 0, platform: plat, type, elite,
          alive: true, deadTimer: 0,
          hp: (type === 'armored' ? 2 : 1) + (elite ? 1 : 0),
          hurtTimer: 0,
          fireCd: 40 + Math.floor(Math.random() * 60),
          hover: Math.random() * Math.PI * 2, // 飞行种浮动相位
          hopV: 0, hopY: 0,                    // 跳跃种垂直状态
          hopCd: 40 + Math.floor(Math.random() * 40),
          charging: false                      // 冲锋种是否正在冲刺
        };
      });
    },

    resetCoins() {
      this.coins = this.coinCfgs.map((c) => ({
        x: c.x, y: c.y, w: COIN_SIZE.w, h: COIN_SIZE.h,
        collected: false, phase: Math.random() * Math.PI * 2
      }));
    },

    // 静态尖刺必须落在实体平台上：悬空的移到最近的实体平台，找不到则移除
    sanitizeSpikes() {
      const solids = this.platforms.filter((p) =>
        !p.move && !p.fall && !p.oneWay && !p.gate);
      const keep = [];
      for (const s of this.spikes) {
        const sy = s.y + s.h;
        let on = false;
        for (const p of solids) {
          if (Math.abs(p.y - sy) > 8) continue;
          const ox = Math.min(s.x + s.w, p.x + p.w) - Math.max(s.x, p.x);
          if (ox >= s.w * 0.45) { on = true; break; }
        }
        if (on) { keep.push(s); continue; }
        // 找最近的可承载平台，水平挪到平台内侧（留 20px 安全边距）
        let best = null, bestD = Infinity;
        for (const p of solids) {
          if (Math.abs(p.y - sy) > 8 || p.w < s.w + 8) continue;
          const pad = Math.min(20, Math.max(4, (p.w - s.w) / 2));
          const tx = Math.max(p.x + pad,
            Math.min(p.x + p.w - s.w - pad, s.x));
          const d = Math.abs(tx - s.x);
          if (d < bestD) { bestD = d; best = tx; }
        }
        if (best !== null) {
          s.x = Math.round(best);
          keep.push(s);
        }
      }
      this.spikes = keep;
    },

    // 地面型陷阱必须落在实体平台上：悬空的移到最近平台，找不到则移除
    sanitizeTraps() {
      const solids = this.platforms.filter((p) =>
        !p.move && !p.fall && !p.oneWay && !p.gate);
      const groundKinds = ['bear', 'saw', 'fire', 'popspike'];
      const keep = [];
      for (const t of this.traps) {
        if (!groundKinds.includes(t.kind)) { keep.push(t); continue; }
        const top = t.y, bottom = t.y + t.h;
        let on = false;
        for (const p of solids) {
          const o = Math.min(t.x + t.w, p.x + p.w) - Math.max(t.x, p.x);
          if (o < Math.min(t.w, 40) * 0.4) continue;
          if (Math.abs(p.y - top) <= 12 || Math.abs(p.y - bottom) <= 12) {
            on = true; break;
          }
        }
        if (on) { keep.push(t); continue; }
        // 找最近的可承载平台，水平挪到平台内侧（留 20px 安全边距）
        let best = null, bestD = Infinity;
        const cur = t.kind === 'saw' ? (t.baseX || t.x) : t.x;
        for (const p of solids) {
          if (p.w < t.w + 8) continue;
          const pad = Math.min(20, Math.max(4, (p.w - t.w) / 2));
          const tx = Math.max(p.x + pad,
            Math.min(p.x + p.w - t.w - pad, cur));
          const d = Math.abs(tx - cur);
          if (d < bestD) { bestD = d; best = { p, tx }; }
        }
        if (best) {
          if (t.kind === 'saw') {
            t.baseX = Math.round(best.tx);
            t.range = Math.min(t.range,
              Math.max(20, (best.p.w - t.w) / 2 - 10));
            t.x = t.baseX;
          } else {
            t.x = Math.round(best.tx);
          }
          keep.push(t);
        }
      }
      this.traps = keep;
    },

    resetBoss() {
      if (!this.bossCfg || this.bossDefeated) { this.boss = null; return; }
      const b = this.bossCfg;
      const plat = this.platforms[b.platform];
      // 胆小鬼模式：Boss 血量与移速降低（联机模式统一关闭）
      const coward = Game.multiplayer ? false : Storage.coward();
      const hp = coward ? Math.max(1, Math.round(b.hp * COWARD.BOSS_HP)) : b.hp;
      const spd = b.speed * (coward ? COWARD.BOSS_SPEED : 1);
      this.boss = {
        x: b.x, y: plat.y - BOSS_SIZE.h,
        w: BOSS_SIZE.w, h: BOSS_SIZE.h,
        dir: b.dir, speed: spd,
        baseSpeed: spd,
        hp: hp, maxHp: hp,
        anim: 0, platform: plat,
        alive: true, hurtTimer: 0,
        phase: 1,                  // 1 = 常规，2 = 狂暴（半血触发）
        summonCd: 0,
        // Boss 攻击状态：0 巡逻 / 1 蓄力 / 2 冲撞 / 3 硬直
        style: b.style || 'brute',
        act: 0, actT: 0,
        nextAttack: b.style === 'guardian' ? BOSS_MECH.GUARD_FIRST
          : (b.style === 'core' ? BOSS_MECH.CORE_FIRST : BOSS_MECH.BRUTE_FIRST),
        nextKind: 1,
        chargeDir: 0,
        beamDelay: 0, beamX: 0
      };
    },

    // 更新移动平台位置，并记录位移（animTick 只在实际游戏帧递增）
    updatePlatforms() {
      for (const p of this.platforms) {
        if (!p.move) { p.dx = 0; p.dy = 0; continue; }
        const t = this.animTick * p.move.speed + p.move.phase;
        const s = Math.sin(t);
        // 端点缓动：|sin| 取幂 < 1 后，平台在端点附近停留更久，换向更平缓
        const eased = Math.sign(s) * Math.pow(Math.abs(s), MECH.MOVER_EASE_POWER);
        const off = eased * p.move.range;
        const nx = p.move.axis === 'x' ? p.baseX + off : p.baseX;
        const ny = p.move.axis === 'y' ? p.baseY + off : p.baseY;
        p.dx = nx - p.x;
        p.dy = ny - p.y;
        p.x = nx; p.y = ny;
      }
      this.animTick++;
    },

    // 距离指定位置最近的玩家（敌人冲锋 / 提示等使用）
    nearestPlayer(x, y) {
      let best = player, bd = Infinity;
      for (const p of players) {
        const d = Math.abs(p.x - x) + Math.abs(p.y - y) * 0.5;
        if (d < bd) { bd = d; best = p; }
      }
      return best;
    },

    updateEnemies() {
      // 时间减速道具：敌人移动速度按倍率降低
      const sf = Game.slowFactor || 1;
      for (const e of this.enemies) {
        if (!e.alive) { e.deadTimer--; continue; }
        if (e.hurtTimer > 0) e.hurtTimer--;
        const minX = e.platform.x;
        const maxX = e.platform.x + e.platform.w - e.w;
        let moveSpeed = e.speed * sf;
        let freeMove = false;             // 幽灵无视平台边界

        if (e.type === 'flyer') {
          // 飞行种：水平慢速巡逻 + 上下悬浮
          e.x += e.dir * e.speed * 0.7 * sf;
          e.y = e.baseY + Math.sin(Game.tick * 0.04 + e.hover) * 22;
        } else if (e.type === 'charger') {
          // 冲锋种：最近玩家进入警戒范围时加速冲向该玩家
          const target = this.nearestPlayer(e.x, e.y);
          e.charging = Math.abs(target.x - e.x) < 300 &&
                       Math.abs(target.y - e.y) < 90 && target.x !== e.x;
          if (e.charging) {
            e.dir = target.x < e.x ? -1 : 1;
            moveSpeed = e.speed * 2.3 * sf;
          }
          e.x += e.dir * moveSpeed;
        } else if (e.type === 'hopper') {
          // 跳跃种：巡逻中周期性弹跳
          e.x += e.dir * e.speed * 0.7 * sf;
          e.hopCd--;
          if (e.hopCd <= 0 && e.hopY === 0) {
            e.hopV = -6.8;
            e.hopCd = 80 + Math.floor(Math.random() * 40);
          }
          if (e.hopV < 0 || e.hopY < 0) {
            e.hopV += 0.4;
            e.hopY += e.hopV;
            if (e.hopY >= 0) { e.hopY = 0; e.hopV = 0; }
          }
          e.y = e.baseY + e.hopY;
        } else if (e.type === 'shooter') {
          // 炮台怪：原地不动，周期性向最近玩家发射弹体
          const target = this.nearestPlayer(e.x, e.y);
          e.dir = target.x < e.x ? -1 : 1;
          e.fireCd -= sf;
          const dx = (target.x + target.w / 2) - (e.x + e.w / 2);
          const dy = (target.y + target.h / 2) - (e.y + e.h / 2);
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          if (e.fireCd <= 0 && Math.abs(dx) < 560 && Math.abs(dy) < 180) {
            const spd = 3.1;
            this.projectiles.push({
              x: e.x + e.w / 2 - 5, y: e.y + e.h / 2 - 5,
              w: 10, h: 10,
              vx: (dx / len) * spd, vy: (dy / len) * spd,
              kind: 'enemy'
            });
            e.fireCd = 100 + Math.floor(Math.random() * 50);
            Sound.spike();
          }
        } else if (e.type === 'ghost') {
          // 幽灵：直线穿过平台缓慢追向最近玩家，上下浮动
          const target = this.nearestPlayer(e.x, e.y);
          const dx = (target.x + target.w / 2) - (e.x + e.w / 2);
          const dy = (target.y + target.h / 2) - (e.y + e.h / 2);
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          e.x += (dx / len) * e.speed * 0.55 * sf;
          e.y += (dy / len) * e.speed * 0.4 * sf +
                 Math.sin(Game.tick * 0.05 + e.hover) * 0.6;
          e.y = Math.max(140, Math.min(GROUND_Y - 40, e.y));
          e.x = Math.max(20, Math.min(this.data.width - 40, e.x));
